<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRetriever V2</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0f; --surface: #12141a; --surface2: #1a1d26;
    --border: #2a2d38; --border-hover: #3a3d48;
    --text: #e4e6ed; --text-dim: #8b8fa3;
    --accent: #22c55e; --accent-dim: #166534;
    --danger: #ef4444; --danger-dim: #7f1d1d;
    --warning: #f59e0b; --blue: #3b82f6;
    --radius: 8px;
  }
  /* Dark-only app: makes native widgets (datetime/time pickers, their
     calendar icons, scrollbars) render in their dark variants */
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface); }
  .header-left { display:flex; align-items:center; gap:14px; }
  .logo { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--accent); letter-spacing:-0.5px; }
  .logo span { color:var(--text-dim); font-weight:400; }
  .version { font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; background:var(--surface2); padding:2px 8px; border-radius:10px; }
  .status-pill { font-size:11px; padding:4px 12px; border-radius:20px; font-family:'JetBrains Mono',monospace; background:var(--accent-dim); color:var(--accent); }
  .status-pill.stopped { background:var(--danger-dim); color:var(--danger); }
  .header-actions { display:flex; gap:12px; align-items:center; }
  .server-clock { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); white-space:nowrap; padding:4px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); cursor:default; }

  /* Buttons */
  button { font-family:'Outfit',sans-serif; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface2); color:var(--text); padding:7px 14px; cursor:pointer; font-size:13px; font-weight:500; transition:all .15s; }
  button:hover { border-color:var(--border-hover); background:var(--border); }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#16a34a; }
  button.danger { background:var(--danger-dim); color:var(--danger); border-color:#991b1b; }
  button.danger:hover { background:#991b1b; }
  button.sm { padding:4px 9px; font-size:12px; }
  button:disabled { opacity:.4; cursor:not-allowed; }

  /* Tabs */
  .tabs { display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--surface); padding:0 28px; }
  .tab { padding:10px 20px; font-size:13px; font-weight:500; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* Settings bar */
  .settings-bar { display:flex; align-items:center; gap:16px; padding:14px 28px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; }
  .settings-bar label { font-size:11px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
  .settings-bar input { font-family:'JetBrains Mono',monospace; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:5px 10px; font-size:13px; width:180px; }
  .settings-bar input:focus { outline:none; border-color:var(--accent); }
  .settings-group { display:flex; align-items:center; gap:8px; }

  /* Main */
  .main { padding:20px 28px; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .section-title { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); }

  /* Instance cards */
  .instances { display:flex; flex-direction:column; gap:6px; }
  .instance-card { display:grid; grid-template-columns:32px 130px 1.2fr 100px 1fr 80px 80px 200px; align-items:center; gap:12px; padding:14px 18px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); transition:border-color .15s; }
  .instance-preview { width:120px; height:67px; border-radius:4px; object-fit:cover; background:var(--bg); border:1px solid var(--border); }
  .instance-preview-empty { width:120px; height:67px; border-radius:4px; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text-dim); }
  .instance-card:hover { border-color:var(--border-hover); }
  .instance-card.running { border-left:3px solid var(--accent); }
  .instance-card.stopped { border-left:3px solid var(--border); }
  .instance-status { width:9px; height:9px; border-radius:50%; background:var(--border); }
  .instance-status.on { background:var(--accent); box-shadow:0 0 8px var(--accent); }
  .instance-info h3 { font-size:13px; font-weight:600; margin-bottom:1px; }
  .instance-id { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:400; color:var(--text-dim); background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; margin-right:6px; vertical-align:1px; }
  .instance-info .meta { font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
  .instance-res { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); }
  .instance-source { font-size:11px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .instance-fps { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--warning); }
  .instance-refresh { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--blue); }
  .instance-actions { display:flex; gap:5px; justify-content:flex-end; }

  /* Toggle */
  .toggle { position:relative; width:34px; height:18px; background:var(--border); border-radius:9px; cursor:pointer; transition:background .2s; flex-shrink:0; }
  .toggle.on { background:var(--accent); }
  .toggle::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:white; transition:transform .2s; }
  .toggle.on::after { transform:translateX(16px); }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; width:540px; max-height:85vh; overflow-y:auto; }
  .modal h2 { font-size:16px; margin-bottom:18px; font-weight:600; }
  .form-group { margin-bottom:12px; }
  .form-group label { display:block; font-size:11px; font-weight:500; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
  .form-group input,.form-group select,.form-group textarea { width:100%; font-family:'JetBrains Mono',monospace; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:7px 11px; font-size:13px; }
  .form-group textarea { min-height:70px; resize:vertical; font-family:'Outfit',sans-serif; }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus { outline:none; border-color:var(--accent); }
  .form-row { display:flex; gap:10px; }
  .form-row .form-group { flex:1; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .text-settings,.refresh-settings { border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
  .form-hint { font-size:11px; color:var(--text-dim); margin-top:3px; }

  /* Media library */
  .media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .media-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:border-color .15s; position:relative; }
  .media-card:hover { border-color:var(--border-hover); }
  .media-card.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .media-card img, .media-card video { width:100%; height:120px; object-fit:cover; display:block; background:#000; }
  .media-card-info { padding:8px 10px; }
  .media-card-name { font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .media-card-meta { font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:2px; }
  .media-card-actions { position:absolute; top:6px; right:6px; display:none; }
  .media-card:hover .media-card-actions { display:flex; gap:4px; }
  .media-usage { font-size:10px; color:var(--accent); margin-top:2px; }

  /* Media library filter chips */
  .media-filters { display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .chip-group { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chip-label { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; width:52px; flex-shrink:0; }
  .chip { padding:3px 11px; font-size:12px; border-radius:14px; background:var(--surface2); border:1px solid var(--border); }
  .chip:hover { border-color:var(--border-hover); }
  .chip.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-dim); font-weight:600; }
  .media-origin { font-size:10px; color:var(--text-dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .media-opt { font-size:10px; margin-top:2px; font-family:'JetBrains Mono',monospace; }
  .media-opt.done { color:var(--accent); }
  .media-opt.busy { color:var(--blue); animation:up-pulse 1.2s ease-in-out infinite; }
  .media-opt.warn { color:var(--warning); }

  .upload-zone { border:2px dashed var(--border); border-radius:var(--radius); padding:32px; text-align:center; color:var(--text-dim); cursor:pointer; transition:border-color .15s; }
  .upload-zone:hover { border-color:var(--accent); color:var(--text); }
  .upload-zone.dragover { border-color:var(--accent); background:var(--accent-dim); }

  .empty-state { text-align:center; padding:50px 20px; color:var(--text-dim); font-size:13px; }
  .empty-state .icon { font-size:36px; margin-bottom:10px; opacity:.3; }

  /* Media picker in modal */
  .media-picker { max-height:200px; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:6px; padding:4px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); }
  .media-picker-item { border:2px solid transparent; border-radius:4px; overflow:hidden; cursor:pointer; }
  .media-picker-item:hover { border-color:var(--border-hover); }
  .media-picker-item.selected { border-color:var(--accent); }
  .media-picker-item img, .media-picker-item video { width:100%; height:60px; object-fit:cover; display:block; background:#000; }

  /* Signage */
  .sg-live { display:flex; gap:18px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; margin-bottom:14px; flex-wrap:wrap; }
  .sg-live img { width:180px; height:101px; object-fit:cover; border-radius:4px; background:#000; border:1px solid var(--border); }
  .sg-live-info { display:flex; flex-direction:column; gap:8px; min-width:220px; flex:1; }
  .sg-live .label { font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }
  .sg-live .val { font-size:14px; font-weight:600; }
  .sg-live .val.dim { color:var(--text-dim); font-weight:400; }
  .sg-remaining { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--warning); }
  .sg-toolbar { display:flex; gap:8px; align-items:center; margin:14px 0 10px; flex-wrap:wrap; }
  .sg-list { display:flex; flex-direction:column; gap:4px; }
  .sg-row { display:grid; grid-template-columns:22px 18px 74px 1fr 130px 190px 62px 150px; align-items:center; gap:10px; padding:7px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .sg-row.grouped { margin-left:30px; grid-template-columns:22px 18px 74px 1fr 130px 190px 62px 150px; }
  .sg-row.dragover { border-color:var(--accent); box-shadow:0 -2px 0 var(--accent); }
  /* Schedule state: red-ish = can't play (expired or disabled), grey = not started yet */
  .sg-row.expired { border-color:#5b1a1a; background:#1a0f11; }
  .sg-row.expired .sg-thumb, .sg-row.expired .sg-name { opacity:.55; }
  .sg-row.expired .sg-sched, .sg-row.expired .sg-status-tag { color:var(--danger); }
  .sg-row.upcoming { opacity:.55; }
  .sg-row.upcoming .sg-sched, .sg-row.upcoming .sg-status-tag { color:var(--text-dim); }
  .sg-status-tag { font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .sg-row.sel { border-color:var(--blue); background:#131b2b; }
  .sg-row.expired.sel, .sg-row.upcoming.sel { border-color:var(--blue); }
  .sg-row.dragging { opacity:.35; }
  .sg-group-row { background:var(--surface2); border-left:3px solid var(--blue); }
  .sg-thumb { width:70px; height:40px; object-fit:cover; border-radius:3px; background:#000; border:1px solid var(--border); }
  .sg-name { font-size:12px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-sub { font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
  .sg-timing { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); }
  .sg-sched { font-size:10px; color:var(--warning); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-imp { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--blue); text-align:right; }
  .sg-actions { display:flex; gap:4px; justify-content:flex-end; }
  .drag-handle { cursor:grab; color:var(--text-dim); text-align:center; user-select:none; }
  .sg-dropzone { border:1px dashed var(--border); border-radius:var(--radius); padding:10px; text-align:center; color:var(--text-dim); font-size:11px; margin-top:4px; }
  .sg-dropzone.dragover { border-color:var(--accent); background:var(--accent-dim); }

  /* Upload progress panel (fixed, survives re-renders) */
  #upload-panel { position:fixed; bottom:16px; right:16px; z-index:300; display:flex; flex-direction:column; gap:6px; width:300px; }
  .up-item { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px; font-size:11px; box-shadow:0 4px 16px rgba(0,0,0,.45); }
  .up-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .up-name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up-status { color:var(--text-dim); font-family:'JetBrains Mono',monospace; flex-shrink:0; }
  .up-item.done .up-status { color:var(--accent); }
  .up-item.error .up-status { color:var(--danger); }
  .up-bar { height:4px; background:var(--bg); border-radius:2px; overflow:hidden; }
  .up-fill { height:100%; background:var(--accent); transition:width .15s; }
  .up-item.error .up-fill { background:var(--danger); }
  .up-item.processing .up-fill { animation:up-pulse 1.2s ease-in-out infinite; }
  @keyframes up-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .up-err { color:var(--danger); margin-top:5px; }
  .up-close { cursor:pointer; color:var(--text-dim); flex-shrink:0; }
  .up-close:hover { color:var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = '/api';
let state = {
  settings: { ndi_hostname:'NDI-STREAMER', output_fps:60, all_running:false },
  instances: [],
  media: [],
  modal: null,
  tab: 'instances',
  fpsInput: '60',
  mediaFilter: { type:'all', source:'all', usage:'all' },
  // Signage tab
  signageInstId: null,
  signage: null,        // GET /instances/<id>/signage payload
  sgModal: null,        // {type:'item'|'group'|'library', obj}
  sgCollapsed: {},      // group id -> collapsed
};
const sgSel = new Set(); // selected signage item ids (multi-select actions)

async function api(path, opts={}) {
  const headers = {};
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(API+path, { headers, ...opts,
    body: opts.body instanceof FormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined)
  });
  return res.json();
}

let settingsEditing = false;
let lastDataSig = '';
let serverClock = null; // {epochMs, offsetMin, tz, receivedAt} — from /settings

// Format the SERVER's wall clock (schedules run on it, not the browser's)
function serverClockText() {
  if (!serverClock) return '';
  const wall = new Date(serverClock.epochMs + (Date.now() - serverClock.receivedAt)
                        + serverClock.offsetMin * 60000);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const p = n => String(n).padStart(2,'0');
  return `${days[wall.getUTCDay()]} ${wall.getUTCMonth()+1}/${wall.getUTCDate()} `
       + `${p(wall.getUTCHours())}:${p(wall.getUTCMinutes())}:${p(wall.getUTCSeconds())}`
       + (serverClock.tz ? ` ${serverClock.tz}` : '');
}
function tickServerClock() {
  const el = document.getElementById('server-clock');
  if (el) el.textContent = serverClockText();
}

async function loadData(force=false) {
  const [settings, instances, media] = await Promise.all([
    api('/settings'), api('/instances'), api('/media'),
  ]);
  // Pull the server clock out of the settings payload BEFORE it feeds the
  // change signature — it changes every poll and must not force re-renders.
  // The header ticks it forward locally between polls.
  if (settings.server_time_ms != null) {
    serverClock = {
      epochMs: settings.server_time_ms,
      offsetMin: settings.server_tz_offset_min || 0,
      tz: settings.server_tz || '',
      receivedAt: Date.now(),
    };
    delete settings.server_time_ms;
    delete settings.server_tz;
    delete settings.server_tz_offset_min;
  }
  state.settings = settings;
  state.instances = instances;
  state.media = media;
  if (!settingsEditing) {
    state.fpsInput = String(settings.output_fps);
  }
  // Signage: keep a valid selection and load the selected playlist
  const sgInsts = instances.filter(i => i.source_type === 'signage');
  if (!sgInsts.some(i => i.id === state.signageInstId)) {
    state.signageInstId = sgInsts.length ? sgInsts[0].id : null;
  }
  if (state.signageInstId) {
    try { state.signage = await api(`/instances/${state.signageInstId}/signage`); }
    catch(e) { state.signage = null; }
  } else {
    state.signage = null;
  }
  // Drop cached previews for instances that are no longer running
  for (const id of Object.keys(previewCache)) {
    if (!instances.some(i => String(i.id) === id && i.running)) {
      URL.revokeObjectURL(previewCache[id]);
      delete previewCache[id];
    }
  }
  // Only rebuild the DOM when the data actually changed — a full re-render
  // every poll recreates every element and makes images flash
  const sig = JSON.stringify([settings, instances, media, state.signage]);
  if (force || sig !== lastDataSig) {
    lastDataSig = sig;
    render();
  }
}

// --- Flicker-free preview refresh -------------------------------------
// Previews are fetched as blobs, fully decoded off-screen, then swapped
// into the existing <img> in place. The old frame stays visible until the
// new one is ready, so there's no flash of empty/loading image.
const previewCache = {}; // instance id -> object URL of last decoded frame
let previewsBusy = false; // reentrancy guard — slow fetches must not pile up

async function updatePreviews() {
  if (previewsBusy || document.hidden) return;
  previewsBusy = true;
  try {
    await _updatePreviews();
  } finally {
    previewsBusy = false;
  }
}

async function _updatePreviews() {
  for (const inst of state.instances) {
    if (!inst.running || state.modal) continue;
    try {
      const res = await fetch(`${API}/instances/${inst.id}/preview?t=${Date.now()}`);
      if (res.status !== 200) continue;
      const blob = await res.blob();
      if (!blob.size) continue;
      const url = URL.createObjectURL(blob);
      const tmp = new Image();
      tmp.src = url;
      try { await tmp.decode(); } catch(e) {}
      const old = previewCache[inst.id];
      previewCache[inst.id] = url;
      // Swap into live cards (decoded → paints instantly, no flash)
      document.querySelectorAll(`img[data-preview="${inst.id}"]`).forEach(img => { img.src = url; });
      // First frame after start: upgrade the placeholder to an image
      document.querySelectorAll(`[data-preview-slot="${inst.id}"]`).forEach(ph => {
        ph.replaceWith(h('img',{className:'instance-preview','data-preview':inst.id,src:url,alt:'Preview'}));
      });
      if (old && old !== url) URL.revokeObjectURL(old);
    } catch(e) {}
  }
}

// Actions
async function saveSettings() {
  state.settings = await api('/settings', { method:'PUT', body:{ output_fps:parseInt(state.fpsInput)||60 }});
  render();
}
async function startAll() { await api('/start-all',{method:'POST'}); await loadData(); }
async function stopAll() { await api('/stop-all',{method:'POST'}); await loadData(); }
async function startInstance(id) { await api(`/instances/${id}/start`,{method:'POST'}); await loadData(); }
async function stopInstance(id) { await api(`/instances/${id}/stop`,{method:'POST'}); await loadData(); }
async function refreshInstance(id) { await api(`/instances/${id}/refresh`,{method:'POST'}); await loadData(); }
async function deleteInstance(id) { if(!confirm('Delete this instance?'))return; await api(`/instances/${id}`,{method:'DELETE'}); await loadData(); }
async function toggleEnabled(inst) { await api(`/instances/${inst.id}`,{method:'PUT',body:{enabled:!inst.enabled}}); await loadData(); }
async function saveInstance(data, id) {
  if(id) await api(`/instances/${id}`,{method:'PUT',body:data});
  else await api('/instances',{method:'POST',body:data});
  state.modal=null; state.modalDefaults=null; await loadData(true);
}
// --- Uploads with progress ---------------------------------------------
// fetch() can't report upload progress, so uploads go through XHR. Each
// file gets a card in a fixed bottom-right panel (outside the re-rendered
// app root) showing % sent, then a "processing" pulse while the server
// probes/converts, then done/error.
const uploads = [];
let uploadSeq = 0;

function updateUploadPanel() {
  let panel = document.getElementById('upload-panel');
  if (!uploads.length) { if (panel) panel.remove(); return; }
  if (!panel) {
    panel = h('div',{id:'upload-panel'});
    document.body.appendChild(panel);
  }
  panel.innerHTML = '';
  for (const u of uploads) {
    const statusText = u.status==='uploading' ? `${u.pct}%`
      : u.status==='processing' ? 'processing…'
      : u.status==='done' ? '✓ done' : '✗ failed';
    panel.appendChild(h('div',{className:`up-item ${u.status}`},
      h('div',{className:'up-head'},
        h('div',{className:'up-name',title:u.name},u.name),
        h('div',{className:'up-status'},statusText),
        (u.status==='done'||u.status==='error')
          ? h('div',{className:'up-close',onClick:()=>{removeUpload(u.id);}},'✕') : null,
      ),
      h('div',{className:'up-bar'},h('div',{className:'up-fill',style:{width:`${u.pct}%`}})),
      u.status==='error'&&u.msg ? h('div',{className:'up-err'},u.msg) : null,
    ));
  }
}

function removeUpload(id) {
  const i = uploads.findIndex(u=>u.id===id);
  if (i>=0) uploads.splice(i,1);
  updateUploadPanel();
}

function uploadWithProgress(url, file) {
  return new Promise(resolve => {
    const u = {id:++uploadSeq, name:file.name, pct:0, status:'uploading', msg:''};
    uploads.push(u); updateUploadPanel();
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        u.pct = Math.round(e.loaded / e.total * 100);
        // Bytes are all sent — now the server is probing/converting
        if (u.pct >= 100) u.status = 'processing';
        updateUploadPanel();
      }
    };
    const finish = ok => { updateUploadPanel(); if(ok) setTimeout(()=>removeUpload(u.id), 4000); resolve(ok); };
    xhr.onload = () => {
      let body = {}; try { body = JSON.parse(xhr.responseText); } catch(e) {}
      if (xhr.status >= 200 && xhr.status < 300) { u.status='done'; u.pct=100; finish(true); }
      else { u.status='error'; u.msg = body.error || `HTTP ${xhr.status}`; finish(false); }
    };
    xhr.onerror = () => { u.status='error'; u.msg='Network error'; finish(false); };
    xhr.ontimeout = () => { u.status='error'; u.msg='Timed out'; finish(false); };
    const fd = new FormData(); fd.append('file', file);
    xhr.send(fd);
  });
}

async function uploadFile(file) {
  await uploadWithProgress(`${API}/media`, file);
  await loadData();
}

// Live preview popup — one window per instance (reused on re-click). Sized
// to the output aspect ratio plus room for the header/footer bars.
function openPreviewPopup(inst) {
  const w = 720;
  const h = Math.round(w * (inst.height / inst.width)) + 70;
  window.open(`/preview/${inst.id}`, `wr2-preview-${inst.id}`,
    `width=${w},height=${h},resizable=yes,scrollbars=no,location=no,toolbar=no,menubar=no`);
}

// DOM helper
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)) {
    if(v==null||v===false) continue; // null/false = attribute absent (setAttribute would stringify it — a disabled="null" button is still disabled)
    if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className') el.className=v;
    else if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k,v);
  }
  for(const c of children.flat()) { if(c==null)continue; el.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return el;
}

function renderInstanceCard(inst) {
  const srcLabel = {
    webpage:'🌐 '+(inst.source_value||'—'),
    image: inst.media_file ? '🖼 '+inst.media_file.original_name : '🖼 '+(inst.source_value||'—'),
    text:'📝 '+(inst.text_content||'—').substring(0,30),
    webcam:'📷 '+((inst.source_value||'—').split('/').pop()),
    video:'🎞 '+(inst.media_file ? inst.media_file.original_name : '—')+(inst.video_loop?' ⟳':''),
    signage:`📺 Playlist · ${inst.signage_item_count||0} item${inst.signage_item_count===1?'':'s'}`,
  }[inst.source_type]||inst.source_value;

  const refreshLabel = inst.refresh_interval > 0
    ? (inst.refresh_interval >= 60 ? `↻ ${Math.round(inst.refresh_interval/60)}m` : `↻ ${inst.refresh_interval}s`)
    : '';

  const preview = inst.running
    ? (previewCache[inst.id]
        ? h('img',{className:'instance-preview','data-preview':inst.id,src:previewCache[inst.id],alt:'Preview'})
        : h('div',{className:'instance-preview-empty','data-preview-slot':inst.id},'Loading…'))
    : h('div',{className:'instance-preview-empty'},'No preview');
  // Thumbnail doubles as the popup opener
  preview.style.cursor = 'pointer';
  preview.title = 'Open live preview window';
  preview.addEventListener('click', ()=>openPreviewPopup(inst));

  return h('div',{className:`instance-card ${inst.running?'running':'stopped'}`},
    h('div',{className:`instance-status ${inst.running?'on':''}`}),
    preview,
    h('div',{className:'instance-info'},
      h('h3',null,h('span',{className:'instance-id',title:'Instance ID — use in API URLs'},`#${inst.id}`),inst.name),
      h('div',{className:'meta'},`NDI Source: ${inst.name}`),
      inst.source_type==='video' && inst.running
        ? h('div',{className:'meta',style:{color:inst.video_state==='playing'?'var(--accent)':'var(--text-dim)'}},
            inst.video_state==='playing'?'▶ PLAYING':'⏸ HOLDING')
        : null,
    ),
    h('div',{className:'instance-res'},`${inst.width}×${inst.height}`),
    h('div',{className:'instance-source'},srcLabel),
    h('div',{className:'instance-fps'},`⚡ ${inst.capture_fps}fps`),
    h('div',{className:'instance-refresh'},refreshLabel),
    h('div',{className:'instance-actions'},
      inst.source_type==='video'
        ? (inst.running && inst.video_state==='playing'
            ? h('button',{className:'sm',onClick:()=>videoStop(inst.id),title:'Stop video playback'},'⏹')
            : h('button',{className:'sm',onClick:()=>videoPlay(inst.id),title:'Play video from start'},'⏵'))
        : null,

      h('div',{className:`toggle ${inst.enabled?'on':''}`,onClick:()=>toggleEnabled(inst),title:inst.enabled?'Enabled':'Disabled'}),

      h('button',{className:'sm',onClick:()=>refreshInstance(inst.id),title:'Refresh'},'↻'),
      h('button',{className:'sm',onClick:()=>{state.modal=inst;render();}},'✎'),
      h('button',{className:'sm danger',onClick:()=>deleteInstance(inst.id)},'✕'),

// --- Media Library filters -------------------------------------------------

function mediaMatchesFilter(m, f) {
  if (f.type==='image' && m.is_video) return false;
  if (f.type==='video' && !m.is_video) return false;
  const src = m.origin || 'library';
  if (f.source!=='all' && src!==f.source) return false;
  const su = m.signage_usage || [];
  if (f.usage==='grouped' && !su.some(u=>u.group_id)) return false;
  if (f.usage==='playlist' && !su.length) return false;
  if (f.usage==='unused') {
    const usedByInst = state.instances.some(i=>i.media_file_id===m.id);
    if (su.length || usedByInst) return false;
  }
  return true;
}

function renderMediaCard(m) {
  const usedBy = state.instances.filter(i=>i.media_file_id===m.id);
  const su = m.signage_usage || [];
  const dur = m.duration_s ? ` · ${Math.floor(m.duration_s/60)}:${String(Math.round(m.duration_s%60)).padStart(2,'0')}` : '';
  const size = m.file_size > 1048576 ? `${(m.file_size/1048576).toFixed(1)}MB` : `${(m.file_size/1024).toFixed(0)}KB`;
  const origin = m.origin || 'library';
  const originLabel = {library:'📁 Library', signage:'📺 Signage upload',
                       deck:`🖽 ${m.origin_name||'Deck'}`}[origin] || origin;
  // One line per playlist appearance: "Instance › Group"
  const suLabels = [...new Set(su.map(u =>
    `${u.instance_name||('#'+u.instance_id)}${u.group_name?` › 🗂 ${u.group_name}`:''}`))];
  return h('div',{className:'media-card'},
    m.is_video
      ? h('video',{src:m.url+'#t=0.1',muted:'true',preload:'metadata',title:m.original_name})
      : h('img',{src:m.url,alt:m.original_name,loading:'lazy'}),
    h('div',{className:'media-card-info'},
      h('div',{className:'media-card-name'},(m.is_video?'🎞 ':'')+m.original_name),
      h('div',{className:'media-card-meta'},
        `${m.width_px||'?'}×${m.height_px||'?'}${dur} · ${size}`),
      h('div',{className:'media-card-meta',title:'Permanent ID for API playback URLs — never reused, even after deletes'},
        `id ${m.id}${m.uid?` · uid ${m.uid}`:''}`),
      h('div',{className:'media-origin',title:'How this file was added'},originLabel),
      (()=>{ // background-optimization state for videos
        const s = m.optimize_status;
        if (s==='done') return h('div',{className:'media-opt done',
          title:'A light H.264 playback copy is used on air; ?original=1 fetches the upload'},
          `⚡ optimized → ${m.optimized_width||'?'}×${m.optimized_height||'?'}`);
        if (s==='native') return h('div',{className:'media-opt done',
          title:'Already H.264/yuv420p within the output size — plays as-is'},
          '✓ playback-ready');
        if (s==='pending'||s==='processing') return h('div',{className:'media-opt busy'},'⚙ optimizing…');
        if (s==='failed') return h('div',{className:'media-opt warn'},'⚠ optimize failed');
        if (s==='skipped') return h('div',{className:'media-opt warn',
          title:'Install ffmpeg on the server (apt install ffmpeg) and click Optimize'},
          '⚠ heavy video — ffmpeg missing');
        return null;
      })(),
      usedBy.length ? h('div',{className:'media-usage'},`Source for: ${usedBy.map(i=>i.name).join(', ')}`) : null,
      suLabels.length ? h('div',{className:'media-usage'},`Playlist: ${suLabels.join(' · ')}`) : null,
    ),
    h('div',{className:'media-card-actions'},
      m.can_optimize
        ? h('button',{className:'sm',title:'Create a light playback copy sized for the outputs',
            onClick:(e)=>{e.stopPropagation();optimizeMedia(m.id);}},'⚡')
        : null,
      h('button',{className:'sm danger',onClick:(e)=>{e.stopPropagation();deleteMedia(m.id);}},'✕'),
    ),
  );
}

function renderMediaPage() {
  const main = h('div',{className:'main'});
  const f = state.mediaFilter;

  // Upload zone
  const zone = h('div',{className:'upload-zone'},'Drop images or videos here, or click to upload');
  const fileInput = h('input',{type:'file',accept:'image/*,video/*',multiple:'true',style:{display:'none'}});
  fileInput.addEventListener('change',e=>{Array.from(e.target.files).forEach(uploadFile);});
  zone.addEventListener('click',()=>fileInput.click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');Array.from(e.dataTransfer.files).forEach(uploadFile);});
  main.appendChild(zone);
  main.appendChild(fileInput);

  // Filter bar — counts are within the OTHER active filters, so they always
  // reflect what clicking the chip would show
  const chipRow = (label, key, options) => {
    const row = h('div',{className:'chip-group'}, h('span',{className:'chip-label'},label));
    for (const [val, text] of options) {
      const count = state.media.filter(m =>
        mediaMatchesFilter(m, {...f, [key]: val})).length;
      row.appendChild(h('button',
        {className:`chip ${f[key]===val?'active':''}`,
         onClick:()=>{state.mediaFilter={...f,[key]:val};render();}},
        `${text} (${count})`));
    }
    return row;
  };
  main.appendChild(h('div',{className:'media-filters'},
    chipRow('Type','type',[['all','All'],['image','Images'],['video','Videos']]),
    chipRow('Source','source',[['all','All'],['library','Library upload'],['signage','Signage upload'],['deck','Deck slides']]),
    chipRow('Usage','usage',[['all','All'],['grouped','In a signage group'],['playlist','In a playlist'],['unused','Unused']]),
  ));

  const filtered = state.media.filter(m=>mediaMatchesFilter(m, f));
  const filterActive = f.type!=='all'||f.source!=='all'||f.usage!=='all';
  main.appendChild(h('div',{className:'section-header',style:{marginTop:'16px'}},
    h('div',{className:'section-title'},
      filterActive ? `Library (${filtered.length} of ${state.media.length} files)`
                   : `Library (${state.media.length} files)`),
  ));

  if(!state.media.length) {
    main.appendChild(h('div',{className:'empty-state'},h('div',{className:'icon'},'🖼'),h('div',null,'No files uploaded yet.')));
  } else if(!filtered.length) {
    main.appendChild(h('div',{className:'empty-state'},h('div',{className:'icon'},'🔍'),h('div',null,'No files match the current filters.')));
  } else if (f.source==='deck') {
    // Deck view: one section per source deck, slides in order
    const decks = {};
    filtered.forEach(m=>{ (decks[m.origin_name||'Unknown deck'] ??= []).push(m); });
    for (const [deck, files] of Object.entries(decks)) {
      main.appendChild(h('div',{className:'section-header',style:{marginTop:'14px'}},
        h('div',{className:'section-title'},`🖽 ${deck} (${files.length} slides)`)));
      const grid = h('div',{className:'media-grid'});
      files.sort((a,b)=>a.original_name.localeCompare(b.original_name))
           .forEach(m=>grid.appendChild(renderMediaCard(m)));
      main.appendChild(grid);
    }
  } else {
    const grid = h('div',{className:'media-grid'});
    filtered.forEach(m=>grid.appendChild(renderMediaCard(m)));
    main.appendChild(grid);
  }
  return main;
}

// --- Signage tab ---------------------------------------------------------

const sgSorted = arr => arr.slice().sort((a,b)=>(a.sort_order-b.sort_order)||(a.id-b.id));
function sgEntries() {
  const g = state.signage.groups.map(x=>({type:'group',obj:x}));
  const it = state.signage.items.filter(i=>!i.group_id).map(x=>({type:'item',obj:x}));
  return [...g,...it].sort((a,b)=>(a.obj.sort_order-b.obj.sort_order)||(a.obj.id-b.obj.id));
}
const sgGroupItems = gid => sgSorted(state.signage.items.filter(i=>i.group_id===gid));

let sgDrag = null; // {type:'item'|'group', id, groupId} | {type:'multi', ids:[...]}

// All item ids in playlist (play) order — used to keep a multi-drag block
// in its existing relative order wherever it lands
function sgFlatItemIds() {
  const out = [];
  for (const e of sgEntries()) {
    if (e.type==='group') sgGroupItems(e.obj.id).forEach(i=>out.push(i.id));
    else out.push(e.obj.id);
  }
  return out;
}

// True when `rowDrag`'s row is (part of) what's being dragged — such rows
// can't be drop targets for their own drag
function sgIsSelfDrop(rowDrag) {
  if (!sgDrag) return true;
  if (sgDrag.type==='multi') return rowDrag.type==='item' && sgDrag.ids.includes(rowDrag.id);
  return sgDrag.type===rowDrag.type && sgDrag.id===rowDrag.id;
}

function sgOrderPayload() {
  return {
    order: sgEntries().map(e=>({type:e.type,id:e.obj.id})),
    group_items: Object.fromEntries(
      state.signage.groups.map(g=>[g.id, sgGroupItems(g.id).map(i=>i.id)])),
  };
}

async function sgApplyMove(drag, target) {
  // drag: single entry or {type:'multi', ids} — a selection moved as a block
  // target: {kind:'row', type, id, groupId} | {kind:'group-append', groupId} | {kind:'end'}
  const p = sgOrderPayload();
  const movedIds = drag.type==='multi' ? drag.ids : [drag.id];
  const movedEntries = drag.type==='group'
    ? [{type:'group',id:drag.id}]
    : movedIds.map(id=>({type:'item',id}));

  // Remove everything being moved from its current position(s)
  if (drag.type==='group') {
    p.order = p.order.filter(e=>!(e.type==='group'&&e.id===drag.id));
  } else {
    p.order = p.order.filter(e=>!(e.type==='item'&&movedIds.includes(e.id)));
    for (const k in p.group_items) {
      p.group_items[k] = p.group_items[k].filter(id=>!movedIds.includes(id));
    }
  }

  if (target.kind==='end') {
    p.order.push(...movedEntries);
  } else if (target.kind==='group-append') {
    if (drag.type==='group') return;    // groups can't nest
    p.group_items[target.groupId].push(...movedIds);
  } else if (target.groupId) {          // dropping onto an item inside a group
    if (drag.type==='group') return;
    const arr = p.group_items[target.groupId];
    const idx = arr.indexOf(target.id);
    arr.splice(idx<0?arr.length:idx, 0, ...movedIds);
  } else {                              // dropping onto a top-level entry
    const idx = p.order.findIndex(e=>e.type===target.type&&e.id===target.id);
    p.order.splice(idx<0?p.order.length:idx, 0, ...movedEntries);
  }
  await api(`/instances/${state.signageInstId}/signage/reorder`,{method:'POST',body:p});
  await loadData(true);
}

function sgMakeDraggable(row, drag, target) {
  row.setAttribute('draggable','true');
  row.addEventListener('dragstart', e=>{
    // Dragging a SELECTED item moves the whole selection as a block,
    // preserving its play order; unselected rows drag alone as before
    if (drag.type==='item' && sgSel.has(drag.id) && sgSel.size>1) {
      sgDrag = {type:'multi', ids: sgFlatItemIds().filter(id=>sgSel.has(id))};
      document.querySelectorAll('.sg-row.sel').forEach(r=>r.classList.add('dragging'));
    } else {
      sgDrag = drag;
    }
    e.dataTransfer.effectAllowed='move';
  });
  row.addEventListener('dragend', ()=>{
    sgDrag = null;
    document.querySelectorAll('.sg-row.dragging').forEach(r=>r.classList.remove('dragging'));
  });
  row.addEventListener('dragover', e=>{
    if(!sgDrag || sgIsSelfDrop(drag)) return;
    e.preventDefault(); row.classList.add('dragover');
  });
  row.addEventListener('dragleave', ()=>row.classList.remove('dragover'));
  row.addEventListener('drop', e=>{
    e.preventDefault(); row.classList.remove('dragover');
    if(sgDrag && !sgIsSelfDrop(drag)) {
      // target may depend on what's being dragged (e.g. group headers accept
      // items INTO the group but groups reorder AROUND it) — resolve at drop
      sgApplyMove(sgDrag, typeof target==='function' ? target() : target);
    }
  });
}

// Server "now" as a naive ISO string ("2026-09-21T14:35:07"). Schedule
// datetimes are stored the same way, so lexicographic comparison is exact
// and immune to the browser being in a different timezone than the server.
function sgServerNowStr() {
  let wall;
  if (serverClock) {
    wall = new Date(serverClock.epochMs + (Date.now() - serverClock.receivedAt)
                    + serverClock.offsetMin * 60000);
  } else {
    const d = new Date();
    wall = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  }
  return wall.toISOString().substring(0, 19);
}

// Schedule state for a row: red-ish when it can't play anymore (expired or
// switched off), grey when it hasn't started yet.
// Returns {cls:''|'expired'|'upcoming', label}
function sgItemStatus(obj, group) {
  const enabled = obj.enabled && (!group || group.enabled);
  if (!enabled) return {cls:'expired', label:'disabled'};
  const now = sgServerNowStr();
  if ((obj.end_at && obj.end_at <= now) || (group && group.end_at && group.end_at <= now))
    return {cls:'expired', label:'expired'};
  const starts = [obj.start_at, group && group.start_at].filter(Boolean);
  if (starts.some(s => s > now))
    return {cls:'upcoming', label:'upcoming'};
  return {cls:'', label:''};
}

function sgFmtDT(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function sgSchedSummary(o) {
  const parts = [];
  if (o.start_at || o.end_at) parts.push(`${o.start_at?sgFmtDT(o.start_at):'…'} → ${o.end_at?sgFmtDT(o.end_at):'…'}`);
  if (o.daily_start && o.daily_end) parts.push(`⏰ ${o.daily_start}–${o.daily_end}`);
  return parts.join(' · ');
}
function sgFmtSecs(v) { return (v%1 ? v.toFixed(1) : String(v))+'s'; }

function sgEffTiming(item, group) {
  const d = state.signage.defaults;
  const m = item.media_file;
  let dur = item.duration_s ?? group?.duration_s ?? (m?.is_video && m.duration_s ? m.duration_s : null) ?? d.duration;
  let fade = item.crossfade_s ?? group?.crossfade_s ?? d.crossfade;
  const inherited = item.duration_s==null;
  return {dur, fade, inherited};
}

function sgItemRow(item, group) {
  const m = item.media_file || {};
  const t = sgEffTiming(item, group);
  const sched = sgSchedSummary(item);
  const cb = h('input',{type:'checkbox',style:{width:'auto'}});
  cb.checked = sgSel.has(item.id);
  cb.addEventListener('change',()=>{
    if(cb.checked) sgSel.add(item.id); else sgSel.delete(item.id);
    row.classList.toggle('sel', cb.checked);
    sgUpdateToolbar();
  });
  cb.addEventListener('click',e=>e.stopPropagation());

  const status = sgItemStatus(item, group);
  const row = h('div',{className:`sg-row ${group?'grouped':''} ${sgSel.has(item.id)?'sel':''} ${status.cls}`},
    h('div',{className:'drag-handle',title:'Drag to reorder'},'⠿'),
    cb,
    m.is_video
      ? h('video',{className:'sg-thumb',src:(m.url||'')+'#t=0.1',muted:'true',preload:'metadata'})
      : h('img',{className:'sg-thumb',src:m.url||'',loading:'lazy',alt:''}),
    h('div',null,
      h('div',{className:'sg-name'},(m.is_video?'🎞 ':'🖼 ')+(m.original_name||'(deleted)')),
      h('div',{className:'sg-sub'},`#${item.id}${m.is_video&&m.duration_s?` · file ${Math.round(m.duration_s)}s`:''}`),
    ),
    h('div',{className:'sg-timing'},`▦ ${sgFmtSecs(t.dur)}${t.inherited?'*':''} · fade ${sgFmtSecs(t.fade)}`),
    h('div',{className:'sg-sched',title:`${status.label?status.label+' · ':''}${sched||'always'}`},
      status.label ? h('span',{className:'sg-status-tag'},status.label+' ') : null,
      sched||'always'),
    h('div',{className:'sg-imp',title:'Impressions (times shown)'},`👁 ${item.impressions||0}`),
    h('div',{className:'sg-actions'},
      h('div',{className:`toggle ${item.enabled?'on':''}`,onClick:()=>sgToggleItem(item),title:item.enabled?'Enabled':'Disabled'}),
      h('button',{className:'sm',onClick:()=>{state.sgModal={type:'item',obj:item};render();},title:'Edit timing & schedule'},'✎'),
      h('button',{className:'sm danger',onClick:()=>sgDeleteItem(item.id)},'✕'),
    ),
  );
  sgMakeDraggable(row,
    {type:'item', id:item.id, groupId:group?group.id:null},
    {kind:'row', type:'item', id:item.id, groupId:group?group.id:null});
  return row;
}

function sgGroupRow(g) {
  const items = sgGroupItems(g.id);
  const collapsed = !!state.sgCollapsed[g.id];
  const sched = sgSchedSummary(g);
  const status = sgItemStatus(g, null);
  const row = h('div',{className:`sg-row sg-group-row ${status.cls}`},
    h('div',{className:'drag-handle',title:'Drag to reorder'},'⠿'),
    h('div',{style:{cursor:'pointer'},onClick:()=>{state.sgCollapsed[g.id]=!collapsed;render();}},collapsed?'▸':'▾'),
    h('div',{style:{fontSize:'20px',textAlign:'center'}},'🗂'),
    h('div',null,
      h('div',{className:'sg-name'},g.name),
      h('div',{className:'sg-sub'},`group · ${items.length} item${items.length===1?'':'s'} — drop items here to add`),
    ),
    h('div',{className:'sg-timing'},
      (g.duration_s!=null||g.crossfade_s!=null)
        ? `▦ ${g.duration_s!=null?sgFmtSecs(g.duration_s):'—'} · fade ${g.crossfade_s!=null?sgFmtSecs(g.crossfade_s):'—'}` : ''),
    h('div',{className:'sg-sched',title:`${status.label?status.label+' · ':''}${sched||'always'}`},
      status.label ? h('span',{className:'sg-status-tag'},status.label+' ') : null,
      sched||'always'),
    h('div',{className:'sg-imp'},''),
    h('div',{className:'sg-actions'},
      h('div',{className:`toggle ${g.enabled?'on':''}`,onClick:()=>sgToggleGroup(g),title:g.enabled?'Enabled':'Disabled'}),
      h('button',{className:'sm',onClick:()=>{state.sgModal={type:'group',obj:g};render();},title:'Edit group'},'✎'),
      h('button',{className:'sm danger',onClick:()=>sgDeleteGroup(g)},'✕'),
    ),
  );
  // Dropping an item on the header appends it to the group; dropping a
  // group on it reorders at the top level
  sgMakeDraggable(row, {type:'group', id:g.id, groupId:null},
    ()=> sgDrag && (sgDrag.type==='item' || sgDrag.type==='multi')
      ? {kind:'group-append', groupId:g.id}
      : {kind:'row', type:'group', id:g.id, groupId:null});
  return row;
}

function sgUpdateToolbar() {
  const n = sgSel.size;
  for (const id of ['sg-group-btn','sg-del-btn','sg-edit-btn']) {
    const el = document.getElementById(id);
    if (el) el.disabled = !n;
  }
  const eb = document.getElementById('sg-edit-btn');
  if (eb) eb.textContent = n ? `✎ Edit Selected (${n})` : '✎ Edit Selected';
  const sa = document.getElementById('sg-selall-btn');
  if (sa) {
    const total = state.signage ? state.signage.items.length : 0;
    sa.textContent = (total && n >= total) ? '☐ Select None' : '☑ Select All';
  }
}

function sgToggleSelectAll() {
  const all = state.signage.items.map(i=>i.id);
  if (sgSel.size >= all.length) sgSel.clear();
  else all.forEach(id=>sgSel.add(id));
  render();
}

async function updateSignageStatus() {
  if (state.tab!=='signage' || !state.signageInstId || document.hidden) return;
  try {
    const s = await api(`/instances/${state.signageInstId}/signage/status`);
    const set = (id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
    if (s.running && s.status) {
      set('sg-now', s.status.current ? s.status.current.name : 'Black (nothing scheduled)');
      set('sg-remaining', s.status.current && s.status.remaining_s!=null
        ? `${Math.max(0,Math.round(s.status.remaining_s))}s left` : '');
      set('sg-next', s.status.next ? s.status.next.name : '—');
    } else {
      set('sg-now', s.running ? 'Starting…' : 'Not running');
      set('sg-next','—'); set('sg-remaining','');
    }
  } catch(e) {}
}

function renderSignagePage() {
  const main = h('div',{className:'main'});
  const sgInsts = state.instances.filter(i=>i.source_type==='signage');

  // Instance selector
  const sel = h('select',{style:{width:'260px',fontFamily:"'JetBrains Mono',monospace",background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'8px',color:'var(--text)',padding:'6px 10px',fontSize:'13px'}});
  sgInsts.forEach(i=>sel.appendChild(h('option',{value:String(i.id)},`#${i.id} ${i.name}`)));
  if (state.signageInstId) sel.value = String(state.signageInstId);
  sel.addEventListener('change',()=>{ state.signageInstId = parseInt(sel.value); sgSel.clear(); loadData(true); });

  main.appendChild(h('div',{className:'section-header'},
    h('div',{style:{display:'flex',alignItems:'center',gap:'10px'}},
      h('div',{className:'section-title'},'Signage Playlist'),
      sgInsts.length ? sel : null,
    ),
    h('button',{className:'primary',onClick:()=>{state.modal='create';state.modalDefaults={source_type:'signage'};render();}},'+ New Signage Instance'),
  ));

  if (!sgInsts.length) {
    main.appendChild(h('div',{className:'empty-state'},h('div',{className:'icon'},'📺'),
      h('div',null,'No signage instances yet. Create one — it appears as an NDI source that plays your scheduled playlist.')));
    return main;
  }
  const inst = sgInsts.find(i=>i.id===state.signageInstId);
  if (!inst || !state.signage) {
    main.appendChild(h('div',{className:'empty-state'},'Loading…'));
    return main;
  }

  // Live panel
  const preview = inst.running
    ? (previewCache[inst.id]
        ? h('img',{'data-preview':inst.id,src:previewCache[inst.id],alt:'Live'})
        : h('div',{className:'instance-preview-empty','data-preview-slot':inst.id,style:{width:'180px',height:'101px'}},'Loading…'))
    : h('div',{className:'instance-preview-empty',style:{width:'180px',height:'101px'}},'Not running');
  preview.style.cursor = 'pointer';
  preview.title = 'Open live preview window';
  preview.addEventListener('click', ()=>openPreviewPopup(inst));
  main.appendChild(h('div',{className:'sg-live'},
    preview,
    h('div',{className:'sg-live-info'},
      h('div',null,h('div',{className:'label'},'Now Playing'),
        h('div',{className:'val',id:'sg-now'},inst.running?'…':'Not running'),
        h('div',{className:'sg-remaining',id:'sg-remaining'},'')),
      h('div',null,h('div',{className:'label'},'Up Next'),
        h('div',{className:'val dim',id:'sg-next'},'—')),
    ),
    h('div',{style:{display:'flex',gap:'8px',flexDirection:'column'}},
      inst.running
        ? h('button',{onClick:()=>sgSkip(),title:'Crossfade to the next item now'},'⏭ Skip Next')
        : h('button',{className:'primary',onClick:()=>startInstance(inst.id)},'▶ Start'),
      inst.running
        ? h('button',{className:'danger',onClick:()=>stopInstance(inst.id)},'■ Stop')
        : null,
      h('button',{className:'sm',onClick:()=>openPreviewPopup(inst),title:'Open live preview window'},'⧉ Popup Preview'),
      h('button',{className:'sm',onClick:()=>{state.modal=inst;render();}},'✎ Instance Settings'),
    ),
  ));

  // Upload zone
  const zone = h('div',{className:'upload-zone'},
    'Drop stills, videos, PowerPoint or PDF here (or click) — decks become a group, one slide per image');
  const fileInput = h('input',{type:'file',accept:'image/*,video/*,.ppt,.pptx,.odp,.pdf',multiple:'true',style:{display:'none'}});
  const sgHandleFiles = files => { (async()=>{ for(const f of files) await sgUploadFile(f); })(); };
  fileInput.addEventListener('change',e=>{sgHandleFiles(Array.from(e.target.files)); e.target.value='';});
  zone.addEventListener('click',()=>fileInput.click());
  zone.addEventListener('dragover',e=>{ if(sgDrag) return; e.preventDefault();zone.classList.add('dragover'); });
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{ if(sgDrag) return; e.preventDefault();zone.classList.remove('dragover');sgHandleFiles(Array.from(e.dataTransfer.files)); });
  main.appendChild(zone);
  main.appendChild(fileInput);

  // Toolbar
  main.appendChild(h('div',{className:'sg-toolbar'},
    h('button',{className:'sm',id:'sg-selall-btn',onClick:sgToggleSelectAll},
      (state.signage.items.length && sgSel.size >= state.signage.items.length) ? '☐ Select None' : '☑ Select All'),
    h('button',{className:'sm',onClick:()=>{state.sgModal={type:'library'};render();}},'+ Add from Library'),
    h('button',{className:'sm',onClick:sgNewGroup},'🗂 New Group'),
    h('button',{className:'sm',id:'sg-group-btn',disabled:sgSel.size?null:'true',onClick:sgGroupSelected},'Group Selected'),
    h('button',{className:'sm',id:'sg-edit-btn',disabled:sgSel.size?null:'true',
      onClick:()=>{state.sgModal={type:'bulk'};render();}},
      sgSel.size?`✎ Edit Selected (${sgSel.size})`:'✎ Edit Selected'),
    h('button',{className:'sm danger',id:'sg-del-btn',disabled:sgSel.size?null:'true',onClick:sgDeleteSelected},'Delete Selected'),
    h('div',{className:'form-hint',style:{marginLeft:'auto'}},
      `Defaults: ${sgFmtSecs(state.signage.defaults.duration)} / fade ${sgFmtSecs(state.signage.defaults.crossfade)} (* = inherited) · drag ⠿ to reorder (selected rows move together) · drop items on a group to add`),
  ));

  // Playlist
  const entries = sgEntries();
  if (!entries.length) {
    main.appendChild(h('div',{className:'empty-state'},h('div',{className:'icon'},'🖼'),
      h('div',null,'Playlist is empty. Upload content above or add from the media library.')));
  } else {
    const list = h('div',{className:'sg-list'});
    for (const e of entries) {
      if (e.type==='group') {
        list.appendChild(sgGroupRow(e.obj));
        if (!state.sgCollapsed[e.obj.id]) sgGroupItems(e.obj.id).forEach(it=>list.appendChild(sgItemRow(it, e.obj)));
      } else {
        list.appendChild(sgItemRow(e.obj, null));
      }
    }
    // Tail drop target: append at the end of the top level
    const endZone = h('div',{className:'sg-dropzone'},'⤓ drop here to move to the end');
    endZone.addEventListener('dragover',e=>{ if(!sgDrag) return; e.preventDefault(); endZone.classList.add('dragover'); });
    endZone.addEventListener('dragleave',()=>endZone.classList.remove('dragover'));
    endZone.addEventListener('drop',e=>{ e.preventDefault(); endZone.classList.remove('dragover'); if(sgDrag) sgApplyMove(sgDrag,{kind:'end'}); });
    list.appendChild(endZone);
    main.appendChild(list);
  }

  setTimeout(updateSignageStatus, 0);
  return main;
}

// --- Signage modals (item / group settings, add-from-library) ------------

function renderSignageModal() {
  if (!state.sgModal) return null;
  const {type} = state.sgModal;
  const close = ()=>{state.sgModal=null;render();};

  if (type==='library') {
    const picked = new Set();
    const grid = h('div',{className:'media-picker',style:{maxHeight:'320px'}});
    state.media.forEach(m=>{
      const thumb = m.is_video
        ? h('video',{src:m.url+'#t=0.1',muted:'true',preload:'metadata',title:m.original_name})
        : h('img',{src:m.url,alt:m.original_name,title:m.original_name});
      const cell = h('div',{className:'media-picker-item',onClick:()=>{
        if(picked.has(m.id)){picked.delete(m.id);cell.classList.remove('selected');}
        else {picked.add(m.id);cell.classList.add('selected');}
      }},thumb);
      grid.appendChild(cell);
    });
    return h('div',{className:'modal-overlay',onClick:e=>{if(e.target.className==='modal-overlay')close();}},
      h('div',{className:'modal'},
        h('h2',null,'Add from Media Library'),
        h('div',{className:'form-hint',style:{marginBottom:'8px'}},'Click to select multiple files — they are appended to the playlist in library order'),
        grid,
        h('div',{className:'modal-actions'},
          h('button',{onClick:close},'Cancel'),
          h('button',{className:'primary',onClick:async()=>{
            if(picked.size) await sgAddFromLibrary([...picked]);
            close();
          }},'Add Selected'),
        ),
      ));
  }

  if (type==='bulk') {
    // Batch edit: each field only changes when its "apply" box is ticked;
    // ticked + left blank resets that field to inherited/none
    const d = state.signage ? state.signage.defaults : {duration:8,crossfade:1};
    const n = sgSel.size;
    function applyField(label, input, hint) {
      const chk = h('input',{type:'checkbox',style:{width:'auto'}});
      input.disabled = true;
      chk.addEventListener('change',()=>{ input.disabled = !chk.checked; });
      return h('div',{className:'form-group'},
        h('label',{style:{display:'flex',alignItems:'center',gap:'7px',textTransform:'none'}},
          chk, label),
        input,
        hint ? h('div',{className:'form-hint'},hint) : null,
      );
    }
    const durInput = h('input',{type:'number',step:'0.5',min:'0.5',placeholder:`blank = inherit (${d.duration}s / video length)`});
    const fadeInput = h('input',{type:'number',step:'0.1',min:'0',max:'30',placeholder:`blank = inherit (${d.crossfade}s)`});
    const startInput = h('input',{type:'datetime-local'});
    const endInput = h('input',{type:'datetime-local'});
    const dsInput = h('input',{type:'time'});
    const deInput = h('input',{type:'time'});
    const enSel = h('select',null,h('option',{value:'1'},'Enabled'),h('option',{value:'0'},'Disabled'));
    const fDur = applyField('Set Duration (s)', durInput);
    const fFade = applyField('Set Crossfade (s)', fadeInput);
    const fStart = applyField('Set Start Showing', startInput, 'Blank = clear (no start restriction)');
    const fEnd = applyField('Set Expire', endInput, 'Blank = clear (never expires)');
    const fDaily = (()=>{ // one apply box covers both daily bounds
      const chk = h('input',{type:'checkbox',style:{width:'auto'}});
      dsInput.disabled = deInput.disabled = true;
      chk.addEventListener('change',()=>{ dsInput.disabled = deInput.disabled = !chk.checked; });
      return h('div',{className:'form-group'},
        h('label',{style:{display:'flex',alignItems:'center',gap:'7px',textTransform:'none'}},chk,'Set Daily Window'),
        h('div',{className:'form-row'},
          h('div',{className:'form-group'},h('label',null,'From'),dsInput),
          h('div',{className:'form-group'},h('label',null,'Until'),deInput)),
        h('div',{className:'form-hint'},'Both blank = clear the daily window'),
      );})();
    const fEn = applyField('Set Enabled/Disabled', enSel);

    async function saveBulk() {
      const set = {};
      if (fDur.querySelector('input[type=checkbox]').checked)
        set.duration_s = durInput.value===''?null:parseFloat(durInput.value);
      if (fFade.querySelector('input[type=checkbox]').checked)
        set.crossfade_s = fadeInput.value===''?null:parseFloat(fadeInput.value);
      if (fStart.querySelector('input[type=checkbox]').checked)
        set.start_at = startInput.value||null;
      if (fEnd.querySelector('input[type=checkbox]').checked)
        set.end_at = endInput.value||null;
      if (fDaily.querySelector('input[type=checkbox]').checked) {
        set.daily_start = dsInput.value?dsInput.value.substring(0,5):null;
        set.daily_end = deInput.value?deInput.value.substring(0,5):null;
      }
      if (fEn.querySelector('input[type=checkbox]').checked)
        set.enabled = enSel.value==='1';
      if (Object.keys(set).length) {
        const res = await api(`/instances/${state.signageInstId}/signage/items/update`,
          {method:'POST',body:{item_ids:[...sgSel], set}});
        if (res && res.error) { alert(res.error); return; }
      }
      state.sgModal = null;
      await loadData(true);
    }

    return h('div',{className:'modal-overlay',onClick:e=>{if(e.target.className==='modal-overlay')close();}},
      h('div',{className:'modal'},
        h('h2',null,`Edit ${n} Selected Item${n===1?'':'s'}`),
        h('div',{className:'form-hint',style:{marginBottom:'10px'}},
          'Tick a field to apply it to every selected item; unticked fields are left as they are.'),
        h('div',{className:'form-row'},fDur,fFade),
        h('div',{className:'text-settings'},
          h('div',{className:'form-row'},fStart,fEnd),
          fDaily,
        ),
        fEn,
        h('div',{className:'modal-actions'},
          h('button',{onClick:close},'Cancel'),
          h('button',{className:'primary',onClick:saveBulk},`Apply to ${n} Item${n===1?'':'s'}`),
        ),
      ));
  }

  // Item or group settings
  const obj = state.sgModal.obj;
  const isGroup = type==='group';
  const d = state.signage ? state.signage.defaults : {duration:8,crossfade:1};
  const dtVal = iso => iso ? iso.substring(0,16) : '';

  const nameInput = isGroup ? h('input',{type:'text',value:obj.name}) : null;
  const durInput = h('input',{type:'number',step:'0.5',min:'0.5',value:obj.duration_s!=null?String(obj.duration_s):'',
    placeholder:isGroup?`inherit (${d.duration}s)`:`auto (video length / ${d.duration}s)`});
  const fadeInput = h('input',{type:'number',step:'0.1',min:'0',max:'30',value:obj.crossfade_s!=null?String(obj.crossfade_s):'',
    placeholder:`inherit (${d.crossfade}s)`});
  const startInput = h('input',{type:'datetime-local',value:dtVal(obj.start_at)});
  const endInput = h('input',{type:'datetime-local',value:dtVal(obj.end_at)});
  const dsInput = h('input',{type:'time',value:obj.daily_start||''});
  const deInput = h('input',{type:'time',value:obj.daily_end||''});
  const enabledCheck = h('input',{type:'checkbox',style:{width:'auto'}});
  enabledCheck.checked = !!obj.enabled;

  async function save() {
    const body = {
      duration_s: durInput.value===''?null:parseFloat(durInput.value),
      crossfade_s: fadeInput.value===''?null:parseFloat(fadeInput.value),
      start_at: startInput.value||null,
      end_at: endInput.value||null,
      daily_start: dsInput.value?dsInput.value.substring(0,5):null,
      daily_end: deInput.value?deInput.value.substring(0,5):null,
      enabled: enabledCheck.checked,
    };
    if (isGroup) body.name = nameInput.value;
    const res = await api(isGroup?`/signage/groups/${obj.id}`:`/signage/items/${obj.id}`,{method:'PUT',body});
    if (res && res.error) { alert(res.error); return; }
    state.sgModal = null;
    await loadData(true);
  }

  const title = isGroup ? `Group: ${obj.name}` :
    `Item: ${(obj.media_file&&obj.media_file.original_name)||('#'+obj.id)}`;
  return h('div',{className:'modal-overlay',onClick:e=>{if(e.target.className==='modal-overlay')close();}},
    h('div',{className:'modal'},
      h('h2',null,title),
      isGroup ? h('div',{className:'form-group'},h('label',null,'Group Name'),nameInput) : null,
      h('div',{className:'form-row'},
        h('div',{className:'form-group'},h('label',null,'Duration (seconds)'),durInput,
          h('div',{className:'form-hint'},isGroup?'Default for items in this group':'Blank = video length / inherited default. Setting it on a video holds the last frame to fill the slot.')),
        h('div',{className:'form-group'},h('label',null,'Crossfade (seconds)'),fadeInput,
          h('div',{className:'form-hint'},'Fade into the NEXT item — starts this long before the slot (or video) ends. 0 = hard cut.')),
      ),
      h('div',{className:'text-settings'},
        h('div',{className:'form-row'},
          h('div',{className:'form-group'},h('label',null,'Start Showing (date & time)'),startInput),
          h('div',{className:'form-group'},h('label',null,'Expire (date & time)'),endInput),
        ),
        h('div',{className:'form-row'},
          h('div',{className:'form-group'},h('label',null,'Daily From'),dsInput),
          h('div',{className:'form-group'},h('label',null,'Daily Until'),deInput),
        ),
        h('div',{className:'form-hint'},'Times are the server’s local wall-clock. Daily window needs both bounds; From later than Until wraps past midnight (e.g. 22:00–06:00). Blank = no restriction.'),
      ),
      h('div',{className:'form-group',style:{marginTop:'10px'}},
        h('label',{style:{display:'flex',alignItems:'center',gap:'8px',textTransform:'none',fontSize:'13px',color:'var(--text)'}},
          enabledCheck, isGroup?'Group enabled (off = whole group skipped)':'Enabled (off = skipped)'),
      ),
      h('div',{className:'modal-actions'},
        h('button',{onClick:close},'Cancel'),
        h('button',{className:'primary',onClick:save},'Save'),
      ),
    ));
}

function renderModal() {
  if(!state.modal) return null;
  const isEdit = state.modal !== 'create';
  const inst = isEdit ? state.modal : (state.modalDefaults || {});
  const field = (k,d) => (inst[k] ?? d);

  const sourceTypeSelect = h('select',null,
    h('option',{value:'webpage'},'Webpage URL'),
    h('option',{value:'image'},'Image'),
    h('option',{value:'text'},'Text'),
    h('option',{value:'webcam'},'Webcam'),
    h('option',{value:'video'},'Video File'),
    h('option',{value:'signage'},'Signage Playlist'),
  );
  if(inst.source_type) sourceTypeSelect.value = inst.source_type;

  const nameInput = h('input',{type:'text',value:field('name',''),placeholder:'Lower Third'});
  const sourceInput = h('input',{type:'text',value:field('source_value',''),placeholder:'https://...'});
  const widthInput = h('input',{type:'number',value:String(field('width',1920))});
  const heightInput = h('input',{type:'number',value:String(field('height',1080))});
  const fpsInput = h('input',{type:'number',value:String(field('capture_fps',30)),min:'1',max:'60'});
  const refreshInput = h('input',{type:'number',value:String(field('refresh_interval',0)),min:'0',placeholder:'0'});

  // Text settings
  const textContent = h('textarea',{placeholder:'Enter text to display...'},field('text_content',''));
  const textFont = h('input',{type:'text',value:field('text_font','Arial')});
  const textSize = h('input',{type:'number',value:String(field('text_size',48))});
  const textColor = h('input',{type:'color',value:field('text_color','#FFFFFF')});
  const textBg = h('input',{type:'color',value:field('text_bg_color','#000000')});
  const textAlign = h('select',null,h('option',{value:'left'},'Left'),h('option',{value:'center'},'Center'),h('option',{value:'right'},'Right'));
  textAlign.value = field('text_align','center');

  const textSection = h('div',{className:'text-settings',id:'text-settings'},
    h('div',{className:'form-group'},h('label',null,'Text Content'),textContent),
    h('div',{className:'form-row'},
      h('div',{className:'form-group'},h('label',null,'Font'),textFont),
      h('div',{className:'form-group'},h('label',null,'Size'),textSize),
    ),
    h('div',{className:'form-row'},
      h('div',{className:'form-group'},h('label',null,'Color'),textColor),
      h('div',{className:'form-group'},h('label',null,'Background'),textBg),
      h('div',{className:'form-group'},h('label',null,'Align'),textAlign),
    ),
  );

  // Media pickers (images for image type, videos for video type)
  let selectedMediaId = field('media_file_id', null);
  function buildPicker(items, {allowNone, onPick}) {
    const grid = h('div',{className:'media-picker'});
    if(allowNone) {
      const noneItem = h('div',{className:`media-picker-item ${!selectedMediaId?'selected':''}`,onClick:()=>{
        selectedMediaId=null;
        grid.querySelectorAll('.media-picker-item').forEach(el=>el.classList.remove('selected'));
        noneItem.classList.add('selected');
      }},h('div',{style:{width:'100%',height:'60px',background:'var(--surface2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'11px',color:'var(--text-dim)'}},'None'));
      grid.appendChild(noneItem);
    }
    items.forEach(m=>{
      const thumb = m.is_video
        ? h('video',{src:m.url+'#t=0.1',title:m.original_name,muted:'true',preload:'metadata'})
        : h('img',{src:m.url,alt:m.original_name,title:m.original_name});
      const item = h('div',{className:`media-picker-item ${selectedMediaId===m.id?'selected':''}`,onClick:()=>{
        selectedMediaId=m.id;
        grid.querySelectorAll('.media-picker-item').forEach(el=>el.classList.remove('selected'));
        item.classList.add('selected');
        if(onPick) onPick(m);
      }},thumb);
      grid.appendChild(item);
    });
    return grid;
  }

  const mediaPicker = h('div',{className:'form-group',id:'media-picker-group'},
    h('label',null,'Select from Library'),
    buildPicker(state.media.filter(m=>!m.is_video), {allowNone:true, onPick:m=>{sourceInput.value=m.url;}}),
    h('div',{className:'form-hint'},'Or enter a URL above'),
  );

  // Video source settings
  const videoLoopSel = h('select',null,
    h('option',{value:'once'},'Play once'),
    h('option',{value:'loop'},'Loop'),
  );
  videoLoopSel.value = field('video_loop',false) ? 'loop' : 'once';
  const videoHoldSel = h('select',null,
    h('option',{value:'last'},'Hold last frame'),
    h('option',{value:'first'},'Hold first frame'),
  );
  videoHoldSel.value = field('video_hold','last');
  const videoAutoplayCheck = h('input',{type:'checkbox',style:{width:'auto'}});
  videoAutoplayCheck.checked = !!field('video_autoplay',false);
  const videoApiName = isEdit ? inst.id : '<id>';
  const videoSection = h('div',{className:'text-settings',id:'video-settings'},
    h('div',{className:'form-group'},
      h('label',null,'Video from Library'),
      buildPicker(state.media.filter(m=>m.is_video), {allowNone:false}),
      h('div',{className:'form-hint'},'Upload videos in the Media Library tab (mp4, mov, mkv, webm…)'),
    ),
    h('div',{className:'form-row'},
      h('div',{className:'form-group'},h('label',null,'Playback Mode'),videoLoopSel),
      h('div',{className:'form-group'},h('label',null,'While Stopped'),videoHoldSel),
    ),
    h('div',{className:'form-group'},
      h('label',{style:{display:'flex',alignItems:'center',gap:'8px',textTransform:'none',fontSize:'13px',color:'var(--text)'}},
        videoAutoplayCheck,'Start playing automatically when the instance starts'),
    ),
    h('div',{className:'form-hint'},
      `Remote control (same port as this page): GET or POST /api/instances/${videoApiName}/video/play · /video/play/<media> (switch & play) · /video/load/<media> (cue first frame) · /video/stop?hold=first|last · /video/status — instance by id or name, media by id, uid, or filename`),
  );

  // Signage source settings (playlist itself is managed in the Signage tab)
  const sgDurInput = h('input',{type:'number',step:'0.5',min:'0.5',value:String(field('signage_duration',8))});
  const sgFadeInput = h('input',{type:'number',step:'0.1',min:'0',max:'30',value:String(field('signage_crossfade',1))});
  const sgApiName = isEdit ? inst.id : '<id>';
  const signageSection = h('div',{className:'text-settings',id:'signage-settings'},
    h('div',{className:'form-row'},
      h('div',{className:'form-group'},h('label',null,'Default Still Duration (s)'),sgDurInput,
        h('div',{className:'form-hint'},'Per-item/group settings override this')),
      h('div',{className:'form-group'},h('label',null,'Default Crossfade (s)'),sgFadeInput,
        h('div',{className:'form-hint'},'0 = hard cuts')),
    ),
    h('div',{className:'form-hint'},
      `Manage the playlist (upload, order, schedules, groups) in the Signage tab. `+
      `Remote control: GET or POST /api/instances/${sgApiName}/signage/skip · /signage/status — instance by id or name`),
  );

  const sourceGroup = h('div',{className:'form-group'},h('label',null,'Source URL'),sourceInput);

  // Webcam device picker
  const webcamSelect = h('select',null,h('option',{value:''},'Detecting webcams…'));
  const webcamHint = h('div',{className:'form-hint'},'Detected V4L2 devices — bound by stable ID, so each camera keeps its output across replugs and reboots');
  const webcamSection = h('div',{className:'form-group'},
    h('label',null,'Webcam Device'), webcamSelect, webcamHint,
  );
  let webcamsLoaded = false;
  async function loadWebcams() {
    if(webcamsLoaded) return;
    webcamsLoaded = true;
    let cams;
    try { cams = await api('/webcams'); }
    catch(e) {
      webcamsLoaded = false; // allow retry on next selection
      webcamHint.textContent = 'Failed to detect webcams — try re-selecting the source type';
      return;
    }
    webcamSelect.innerHTML = '';
    if(!cams.length) {
      webcamSelect.appendChild(h('option',{value:''},'No webcams detected'));
      webcamHint.textContent = 'No V4L2 capture devices found — check connections and permissions';
    }
    // Store the stable udev ID (survives replug/reboot) when available,
    // falling back to the raw device node
    cams.forEach(c=>{
      const val = c.stable_id || c.device;
      const label = `${c.name}${c.serial ? ' · SN '+c.serial : ''} (${c.device})`;
      webcamSelect.appendChild(h('option',{value:val},label));
    });
    const cur = field('source_value','');
    if(isEdit && inst.source_type==='webcam' && cur) {
      // Match stored value against either identifier so instances saved with
      // a raw device path upgrade to the stable ID on their next save
      const m = cams.find(c=>c.device===cur || c.stable_id===cur);
      if(m) {
        webcamSelect.value = m.stable_id || m.device;
      } else {
        webcamSelect.appendChild(h('option',{value:cur},`${cur} (not detected)`));
        webcamSelect.value = cur;
      }
    }
  }

  function updateVisibility() {
    const st = sourceTypeSelect.value;
    textSection.style.display = st==='text'?'block':'none';
    mediaPicker.style.display = st==='image'?'block':'none';
    videoSection.style.display = st==='video'?'block':'none';
    signageSection.style.display = st==='signage'?'block':'none';
    sourceGroup.style.display = (st==='webcam'||st==='video'||st==='signage')?'none':'block';
    webcamSection.style.display = st==='webcam'?'block':'none';
    if(st==='webcam') loadWebcams();
  }
  sourceTypeSelect.addEventListener('change', updateVisibility);

  function handleSave() {
    const st = sourceTypeSelect.value;
    const data = {
      name: nameInput.value,
      source_type: st,
      source_value: (st==='webcam') ? webcamSelect.value : ((st==='video'||st==='signage') ? '' : sourceInput.value),
      media_file_id: (st==='image'||st==='video') ? selectedMediaId : null,
      signage_duration: parseFloat(sgDurInput.value)||8,
      signage_crossfade: sgFadeInput.value==='' ? 1 : Math.max(0, parseFloat(sgFadeInput.value)||0),
      video_loop: videoLoopSel.value==='loop',
      video_hold: videoHoldSel.value,
      video_autoplay: videoAutoplayCheck.checked,
      width: parseInt(widthInput.value)||1920,
      height: parseInt(heightInput.value)||1080,
      capture_fps: parseInt(fpsInput.value)||30,
      refresh_interval: parseInt(refreshInput.value)||0,
      text_content: textContent.value,
      text_font: textFont.value,
      text_size: parseInt(textSize.value)||48,
      text_color: textColor.value,
      text_bg_color: textBg.value,
      text_align: textAlign.value,
    };
    saveInstance(data, isEdit?inst.id:null);
  }

  const modal = h('div',{className:'modal-overlay',onClick:e=>{
    if(e.target.className==='modal-overlay'){state.modal=null;render();}
  }},
    h('div',{className:'modal'},
      h('h2',null,isEdit?'Edit Instance':'New Instance'),
      h('div',{className:'form-group'},h('label',null,'Instance Name (NDI Source Name)'),nameInput),
      h('div',{className:'form-group'},h('label',null,'Source Type'),sourceTypeSelect),
      sourceGroup,
      webcamSection,
      mediaPicker,
      videoSection,
      signageSection,
      h('div',{className:'form-row'},
        h('div',{className:'form-group'},h('label',null,'Width'),widthInput),
        h('div',{className:'form-group'},h('label',null,'Height'),heightInput),
      ),
      h('div',{className:'form-row'},
        h('div',{className:'form-group'},h('label',null,'Capture FPS'),fpsInput),
        h('div',{className:'form-group'},
          h('label',null,'Auto-Refresh (seconds)'),
          refreshInput,
          h('div',{className:'form-hint'},'0 = disabled. e.g. 1800 = 30 min'),
        ),
      ),
      textSection,
      h('div',{className:'modal-actions'},
        h('button',{onClick:()=>{state.modal=null;render();}},'Cancel'),
        h('button',{className:'primary',onClick:handleSave},isEdit?'Save Changes':'Create Instance'),
      ),
    ),
  );
  setTimeout(updateVisibility,0);
  return modal;
}

function render() {
  const root = document.getElementById('app');
  root.innerHTML = '';
  root.appendChild(renderHeader());
  root.appendChild(renderTabs());
  if(state.tab==='instances') {
    root.appendChild(renderSettingsBar());
    root.appendChild(renderInstancesPage());
  } else if(state.tab==='signage') {
    root.appendChild(renderSignagePage());
  } else {
    root.appendChild(renderMediaPage());
  }
  const modal = renderModal();
  if(modal) root.appendChild(modal);
  const sgModal = renderSignageModal();
  if(sgModal) root.appendChild(sgModal);
}

// A modal open or a drag in progress must not be clobbered by a poll re-render
const uiBusy = () => state.modal || state.sgModal || sgDrag;

loadData();
setInterval(() => { if (!uiBusy() && !document.hidden) loadData(); }, 5000);
setInterval(updatePreviews, 2000);
setInterval(updateSignageStatus, 2000);
setInterval(tickServerClock, 1000);
// Catch up immediately when the tab becomes visible again
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !uiBusy()) { loadData(); updatePreviews(); }
});
</script>
</body>
</html>
