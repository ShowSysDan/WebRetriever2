<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRetriever V2</title>
<!-- Fonts load async with system fallbacks: on an isolated/air-gapped
     network this never blocks or delays first render -->
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root {
    --bg: #0a0b0f; --surface: #12141a; --surface2: #1a1d26;
    --border: #2a2d38; --border-hover: #3a3d48;
    --text: #e4e6ed; --text-dim: #8b8fa3;
    --accent: #22c55e; --accent-dim: #166534;
    --danger: #ef4444; --danger-dim: #7f1d1d;
    --warning: #f59e0b; --blue: #3b82f6;
    --radius: 8px;
  }
  /* Dark-only app: makes native widgets (datetime/time pickers, their
     calendar icons, scrollbars) render in their dark variants */
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--surface); }
  .header-left { display:flex; align-items:center; gap:14px; }
  .logo { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--accent); letter-spacing:-0.5px; }
  .logo span { color:var(--text-dim); font-weight:400; }
  .version { font-size:10px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; background:var(--surface2); padding:2px 8px; border-radius:10px; }
  .status-pill { font-size:12px; padding:4px 12px; border-radius:20px; font-family:'JetBrains Mono',monospace; background:var(--accent-dim); color:var(--accent); }
  .status-pill.stopped { background:var(--danger-dim); color:var(--danger); }
  .status-pill.rx { background:var(--surface2); color:var(--blue); border:1px solid var(--border); cursor:default; }

  /* Tally badges (reported by the NDI SDK) */
  .tally { font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; letter-spacing:.5px; border-radius:3px; padding:1px 5px; }
  .tally.pgm { background:var(--danger); color:#fff; }
  .tally.pvw { background:var(--accent); color:#000; }

  /* Overview — bento grid of modular tiles */
  .bento { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
  .tile.click { cursor:pointer; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .tile.click:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.35); border-color:var(--border-hover); }
  .tile.span2 { grid-column:span 2; }
  @media (max-width:640px) { .tile.span2 { grid-column:span 1; } }
  .t-label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
  .t-big { font-size:clamp(26px,2.6vw,38px); font-weight:700; font-family:'JetBrains Mono',monospace; line-height:1.1; font-variant-numeric:tabular-nums; }
  .t-big small { font-size:.42em; font-weight:500; color:var(--text-dim); font-family:'Outfit',sans-serif; }
  .t-big.ok { color:var(--accent); }
  .t-big.blue { color:var(--blue); }
  .t-sub { font-size:12px; color:var(--text-dim); margin-top:6px; }
  .t-rows { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .t-row { display:flex; align-items:center; gap:8px; font-size:13px; min-width:0; }
  .t-row .dot { width:8px; height:8px; border-radius:50%; background:var(--border); flex-shrink:0; }
  .t-row .dot.on { background:var(--accent); box-shadow:0 0 6px var(--accent); }
  .t-row .grow { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .t-row .mono { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); white-space:nowrap; }

  /* Receivers modal (who is pulling a source / the whole server) */
  .rx-stats { display:flex; gap:36px; margin-bottom:6px; flex-wrap:wrap; }
  .rx-stat-label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  .rx-stat-val { font-size:18px; font-weight:600; font-family:'JetBrains Mono',monospace; }
  .rx-table { width:100%; border-collapse:collapse; font-size:13px; }
  .rx-table th { text-align:left; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; padding:4px 8px; border-bottom:1px solid var(--border); }
  .rx-table td { padding:6px 8px; border-bottom:1px solid var(--border); }
  .rx-table td.mono { font-family:'JetBrains Mono',monospace; font-size:12px; }
  .rx-table tr.gone td { opacity:.4; }
  .header-actions { display:flex; gap:12px; align-items:center; }
  .server-clock { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); white-space:nowrap; padding:4px 10px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); cursor:default; }

  /* Buttons */
  button { font-family:'Outfit',sans-serif; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface2); color:var(--text); padding:7px 14px; cursor:pointer; font-size:13px; font-weight:500; transition:all .15s; }
  button:hover { border-color:var(--border-hover); background:var(--border); }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#16a34a; }
  button.danger { background:var(--danger-dim); color:var(--danger); border-color:#991b1b; }
  button.danger:hover { background:#991b1b; }
  button.sm { padding:4px 9px; font-size:12px; }
  button:disabled { opacity:.4; cursor:not-allowed; }

  /* Tabs */
  .tabs { display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--surface); padding:0 28px; }
  .tab { padding:11px 22px; font-size:14px; font-weight:500; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

  /* Settings bar */
  .settings-bar { display:flex; align-items:center; gap:16px; padding:14px 28px; border-bottom:1px solid var(--border); background:var(--surface); flex-wrap:wrap; }
  .settings-bar label { font-size:12px; color:var(--text-dim); font-weight:500; text-transform:uppercase; letter-spacing:.5px; }
  .settings-bar input { font-family:'JetBrains Mono',monospace; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:5px 10px; font-size:13px; width:180px; }
  .settings-bar input:focus { outline:none; border-color:var(--accent); }
  .settings-group { display:flex; align-items:center; gap:8px; }

  /* Main */
  .main { padding:20px 28px; }
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .section-title { font-size:14px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; color:var(--text-dim); }

  /* Instance cards */
  .instance-card:hover { border-color:var(--border-hover); }
  .instance-id { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:400; color:var(--text-dim); background:var(--surface2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; margin-right:6px; vertical-align:1px; }

  /* Toggle */
  .toggle { position:relative; width:34px; height:18px; background:var(--border); border-radius:9px; cursor:pointer; transition:background .2s; flex-shrink:0; }
  .toggle.on { background:var(--accent); }
  .toggle::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:white; transition:transform .2s; }
  .toggle.on::after { transform:translateX(16px); }

  /* Modal */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; width:540px; max-height:85vh; overflow-y:auto; }
  .modal h2 { font-size:16px; margin-bottom:18px; font-weight:600; }
  .form-group { margin-bottom:12px; }
  .form-group label { display:block; font-size:11px; font-weight:500; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; }
  .form-group input,.form-group select,.form-group textarea { width:100%; font-family:'JetBrains Mono',monospace; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); color:var(--text); padding:7px 11px; font-size:13px; }
  .form-group textarea { min-height:70px; resize:vertical; font-family:'Outfit',sans-serif; }
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus { outline:none; border-color:var(--accent); }
  .form-row { display:flex; gap:10px; }
  .form-row .form-group { flex:1; }
  .modal-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .text-settings,.refresh-settings { border-top:1px solid var(--border); padding-top:12px; margin-top:12px; }
  .form-hint { font-size:12px; color:var(--text-dim); margin-top:3px; }

  /* Media library */
  .media-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }
  .media-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:border-color .15s; position:relative; }
  .media-card:hover { border-color:var(--border-hover); }
  .media-card.selected { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .media-card img, .media-card video { width:100%; height:120px; object-fit:cover; display:block; background:#000; }
  .media-thumb-wrap { position:relative; background:#000; height:120px; }
  .media-thumb-wrap .play-glyph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:24px; color:rgba(255,255,255,.7); text-shadow:0 1px 8px rgba(0,0,0,.9); pointer-events:none; }
  .media-card-info { padding:8px 10px; }
  .media-card-name { font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .media-card-meta { font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; margin-top:2px; }
  .media-card-actions { position:absolute; top:6px; right:6px; display:none; }
  .media-card:hover .media-card-actions { display:flex; gap:4px; }
  .media-usage { font-size:11px; color:var(--accent); margin-top:2px; }

  /* Media library filter chips */
  .media-filters { display:flex; flex-direction:column; gap:6px; margin-top:14px; }
  .chip-group { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chip-label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; width:56px; flex-shrink:0; }
  .chip { padding:3px 11px; font-size:13px; border-radius:14px; background:var(--surface2); border:1px solid var(--border); }
  .chip:hover { border-color:var(--border-hover); }
  .chip.active { background:var(--accent-dim); color:var(--accent); border-color:var(--accent-dim); font-weight:600; }
  .media-origin { font-size:11px; color:var(--text-dim); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Plain-text type chips — immune to font fallback, unlike pictographs */
  .type-badge { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:600; letter-spacing:.5px; color:var(--text-dim); background:var(--surface2); border:1px solid var(--border); border-radius:3px; padding:0 4px; margin-right:6px; vertical-align:1px; }
  .media-opt { font-size:11px; margin-top:2px; font-family:'JetBrains Mono',monospace; }
  .media-opt.done { color:var(--accent); }
  .media-opt.busy { color:var(--blue); animation:up-pulse 1.2s ease-in-out infinite; }
  .media-opt.warn { color:var(--warning); }

  .upload-zone { border:2px dashed var(--border); border-radius:var(--radius); padding:32px; text-align:center; color:var(--text-dim); cursor:pointer; transition:border-color .15s; }
  .upload-zone:hover { border-color:var(--accent); color:var(--text); }
  .upload-zone.dragover { border-color:var(--accent); background:var(--accent-dim); }

  .empty-state { text-align:center; padding:50px 20px; color:var(--text-dim); font-size:13px; }
  .empty-state .icon { font-size:36px; margin-bottom:10px; opacity:.3; }

  /* Media picker in modal */
  .media-picker { max-height:200px; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:6px; padding:4px; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius); }
  .media-picker-item { border:2px solid transparent; border-radius:4px; overflow:hidden; cursor:pointer; }
  .media-picker-item:hover { border-color:var(--border-hover); }
  .media-picker-item.selected { border-color:var(--accent); }
  .media-picker-item img, .media-picker-item video { width:100%; height:60px; object-fit:cover; display:block; background:#000; }

  /* Signage */
  .sg-live { display:flex; gap:36px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 20px; margin-bottom:14px; flex-wrap:wrap; }
  .sg-live-info { display:flex; gap:40px; flex:1; min-width:280px; flex-wrap:wrap; }
  .sg-live .label { font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  .sg-live .val { font-size:18px; font-weight:600; }
  .sg-live .val.dim { color:var(--text-dim); font-weight:400; }
  .sg-live-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .sg-remaining { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--warning); margin-top:2px; }
  .sg-toolbar { display:flex; gap:8px; align-items:center; margin:14px 0 10px; flex-wrap:wrap; }
  .sg-list { display:flex; flex-direction:column; gap:4px; }
  .sg-row { display:grid; grid-template-columns:22px 18px 74px 1fr 130px 190px 76px 150px; align-items:center; gap:10px; padding:7px 12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
  .sg-row.grouped { margin-left:30px; grid-template-columns:22px 18px 74px 1fr 130px 190px 76px 150px; }
  .sg-row.dragover { border-color:var(--accent); box-shadow:0 -2px 0 var(--accent); }
  /* Schedule state: red-ish = can't play (expired or disabled), grey = not started yet */
  .sg-row.expired { border-color:#5b1a1a; background:#1a0f11; }
  .sg-row.expired .sg-thumb, .sg-row.expired .sg-name { opacity:.55; }
  .sg-row.expired .sg-sched, .sg-row.expired .sg-status-tag { color:var(--danger); }
  .sg-row.upcoming { opacity:.55; }
  .sg-row.upcoming .sg-sched, .sg-row.upcoming .sg-status-tag { color:var(--text-dim); }
  .sg-status-tag { font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .sg-row.sel { border-color:var(--blue); background:#131b2b; }
  .sg-row.expired.sel, .sg-row.upcoming.sel { border-color:var(--blue); }
  /* On air — the item (and its group header) currently playing on the output */
  .sg-row.playing { border-color:var(--accent); background:#0d2114; box-shadow:inset 3px 0 0 var(--accent); }
  .sg-row.playing .sg-name { color:var(--accent); }
  .sg-onair { display:none; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; color:#000; background:var(--accent); border-radius:3px; padding:1px 6px; margin-left:8px; vertical-align:1px; letter-spacing:.5px; }
  .sg-row.playing .sg-onair { display:inline-block; }
  .sg-row.dragging { opacity:.35; }
  .sg-group-row { background:var(--surface2); border-left:3px solid var(--blue); }
  .sg-thumb { width:70px; height:40px; object-fit:cover; border-radius:3px; background:#000; border:1px solid var(--border); }
  .sg-name { font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-sub { font-size:11px; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }
  .sg-timing { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-dim); }
  .sg-sched { font-size:11px; color:var(--warning); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-imp { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--blue); text-align:right; }
  .sg-actions { display:flex; gap:4px; justify-content:flex-end; }
  .drag-handle { cursor:grab; color:var(--text-dim); text-align:center; user-select:none; }
  .sg-dropzone { border:1px dashed var(--border); border-radius:var(--radius); padding:10px; text-align:center; color:var(--text-dim); font-size:11px; margin-top:4px; }
  .sg-dropzone.dragover { border-color:var(--accent); background:var(--accent-dim); }

  /* Upload progress panel (fixed, survives re-renders) */
  #upload-panel { position:fixed; bottom:16px; right:16px; z-index:300; display:flex; flex-direction:column; gap:6px; width:300px; }
  .up-item { background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius); padding:9px 11px; font-size:11px; box-shadow:0 4px 16px rgba(0,0,0,.45); }
  .up-head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .up-name { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .up-status { color:var(--text-dim); font-family:'JetBrains Mono',monospace; flex-shrink:0; }
  .up-item.done .up-status { color:var(--accent); }
  .up-item.error .up-status { color:var(--danger); }
  .up-bar { height:4px; background:var(--bg); border-radius:2px; overflow:hidden; }
  .up-fill { height:100%; background:var(--accent); transition:width .15s; }
  .up-item.error .up-fill { background:var(--danger); }
  .up-item.processing .up-fill { animation:up-pulse 1.2s ease-in-out infinite; }
  @keyframes up-pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .up-err { color:var(--danger); margin-top:5px; }
  .up-close { cursor:pointer; color:var(--text-dim); flex-shrink:0; }
  .up-close:hover { color:var(--text); }

  /* --- 2026 freshening pass ------------------------------------------
     Micro-interactions (every state change acknowledged), controlled
     glass depth on overlays + sticky nav, spatial shadow layering,
     fluid type via clamp(), accessible focus rings, thin scrollbars.
     Honors prefers-reduced-motion. */

  /* Subtle aurora depth behind the surfaces (fixed, ~zero paint cost) */
  body {
    background:
      radial-gradient(1100px 520px at 85% -10%, rgba(34,197,94,.07), transparent 60%),
      radial-gradient(900px 520px at -10% 105%, rgba(59,130,246,.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }

  /* Tabs stick with a frosted layer — the depth cue says "chrome above content" */
  .tabs { position:sticky; top:0; z-index:40; background:rgba(18,20,26,.85); backdrop-filter:blur(10px); }

  /* Micro-interactions: hover lift + settle on press; disabled stays inert */
  button:hover { transform:translateY(-1px); box-shadow:0 2px 10px rgba(0,0,0,.35); }
  button.primary:hover { box-shadow:0 2px 14px rgba(34,197,94,.35); }
  button:active { transform:translateY(0); box-shadow:none; }
  button:disabled:hover { transform:none; box-shadow:none; }
  .instance-card, .media-card { transition:transform .15s, box-shadow .15s, border-color .15s; }
  .instance-card:hover, .media-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.35); }

  /* Focus acknowledgment: visible rings for keyboard users, soft glow on inputs */
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus,
  .settings-bar input:focus { box-shadow:0 0 0 3px rgba(34,197,94,.14); }

  /* Layered glass on modal overlays: blur communicates what recedes */
  .modal-overlay { background:rgba(5,6,10,.68); backdrop-filter:blur(4px); }
  .modal { box-shadow:0 24px 80px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.3); }

  /* Fluid type: smooth scale between laptop and control-room wall monitor */
  .logo { font-size:clamp(16px, 1.2vw + 11px, 21px); }
  .section-title { font-size:clamp(13px, .4vw + 12px, 15px); }
  .sg-live .val, .rx-stat-val { font-size:clamp(16px, 1vw + 12px, 21px); }
  .sg-live .val { font-variant-numeric:tabular-nums; }

  /* Thin, theme-matched scrollbars */
  * { scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--border-hover); }
  ::-webkit-scrollbar-track { background:transparent; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
    .instance-card:hover, .media-card:hover, button:hover { transform:none; }
  }

  /* Full-page upload overlay — shown while uploads are in flight; the
     bottom-right mini panel above is the minimized / all-done fallback */
  #upload-overlay { position:fixed; inset:0; background:rgba(5,6,10,.82); backdrop-filter:blur(3px); z-index:400; display:flex; align-items:center; justify-content:center; }
  .upov-panel { width:min(680px,92vw); max-height:82vh; overflow-y:auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:28px 32px; box-shadow:0 24px 80px rgba(0,0,0,.6); }
  .upov-title { font-size:20px; font-weight:600; }
  .upov-sub { font-size:13px; color:var(--text-dim); margin:4px 0 20px; }
  .upov-item { margin-bottom:18px; }
  .upov-head { display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin-bottom:8px; }
  .upov-name { font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upov-status { font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:700; color:var(--text-dim); flex-shrink:0; }
  .upov-item.done .upov-status { color:var(--accent); }
  .upov-item.error .upov-status { color:var(--danger); }
  .upov-bar { height:14px; background:var(--bg); border:1px solid var(--border); border-radius:7px; overflow:hidden; }
  .upov-fill { height:100%; background:var(--accent); border-radius:7px; transition:width .15s; }
  .upov-item.error .upov-fill { background:var(--danger); }
  .upov-item.processing .upov-fill { animation:up-pulse 1.2s ease-in-out infinite; }
  .upov-err { color:var(--danger); font-size:12px; margin-top:6px; }
  .upov-actions { display:flex; justify-content:flex-end; margin-top:8px; }

  /* --- Broadcast console pass -----------------------------------------
     Three depth levels (bg → surface → raised), light-catching top edges,
     per-tile color tints, and live state rendered as light: pulsing
     dots, glowing tallies, red/green frames for program/preview. */
  :root {
    --bg:#06070b; --surface:#10121a; --surface2:#181b26; --raised:#1d2130;
    --border:rgba(255,255,255,.075); --border-hover:rgba(255,255,255,.16);
    --cyan:#22d3ee; --purple:#a78bfa;
    --hl:inset 0 1px 0 rgba(255,255,255,.055);
    --lift:0 1px 2px rgba(0,0,0,.45), 0 10px 30px -10px rgba(0,0,0,.7);
    --glow-g:0 0 18px rgba(34,197,94,.45);
    --glow-r:0 0 18px rgba(239,68,68,.55);
  }
  body {
    background:
      radial-gradient(1000px 560px at 88% -10%, rgba(34,197,94,.17), transparent 60%),
      radial-gradient(900px 640px at -8% 110%, rgba(59,130,246,.16), transparent 60%),
      radial-gradient(700px 420px at 45% 55%, rgba(167,139,250,.06), transparent 70%),
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px) 0 0/32px 32px,
      var(--bg);
    background-attachment:fixed;
  }

  /* Chrome: glass header with a green horizon line, glowing active tab */
  .header { background:linear-gradient(180deg,rgba(26,29,42,.92),rgba(12,14,20,.8)); backdrop-filter:blur(14px);
            border-bottom:1px solid var(--border); box-shadow:0 1px 0 rgba(34,197,94,.22), 0 10px 30px -12px rgba(0,0,0,.8); position:relative; z-index:41; }
  .logo { background:linear-gradient(90deg,#4ade80,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 0 10px rgba(34,197,94,.35)); }
  .logo span { -webkit-text-fill-color:#8b8fa3; }
  .version { border:1px solid var(--border); }
  .status-pill { border:1px solid rgba(34,197,94,.5); background:rgba(34,197,94,.12); box-shadow:var(--glow-g), inset 0 0 10px rgba(34,197,94,.15); text-shadow:0 0 8px rgba(34,197,94,.8); }
  .status-pill.stopped { border-color:rgba(239,68,68,.45); background:rgba(239,68,68,.1); box-shadow:none; text-shadow:none; }
  .status-pill.rx { border-color:rgba(59,130,246,.45); background:rgba(59,130,246,.1); box-shadow:0 0 14px rgba(59,130,246,.3); text-shadow:0 0 8px rgba(59,130,246,.7); }
  .server-clock { background:rgba(0,0,0,.45); border-color:var(--border); color:#b7bccd; box-shadow:inset 0 1px 3px rgba(0,0,0,.6); }
  .tabs { background:rgba(10,12,18,.72) !important; border-bottom:1px solid var(--border); }
  .tab { position:relative; }
  .tab.active { color:#4ade80; text-shadow:0 0 14px rgba(34,197,94,.6); background:linear-gradient(180deg,transparent 30%,rgba(34,197,94,.1)); border-bottom-color:transparent; }
  .tab.active::after { content:''; position:absolute; left:12px; right:12px; bottom:-1px; height:2px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--cyan)); box-shadow:0 0 10px var(--accent); }
  .settings-bar { background:rgba(12,14,20,.55); border-bottom:1px solid var(--border); }
  .settings-bar input, .form-group input, .form-group select, .form-group textarea { background:rgba(0,0,0,.35); box-shadow:inset 0 1px 3px rgba(0,0,0,.5); }
  .section-title { color:var(--text); display:flex; align-items:center; gap:10px; }
  .section-title::before { content:''; width:4px; height:16px; border-radius:2px; background:linear-gradient(var(--accent),var(--cyan)); box-shadow:var(--glow-g); }

  /* Raised surfaces */
  .tile, .instance-card, .sg-live, .sg-row, .media-card, .modal, .upov-panel {
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 55%), var(--surface);
    border:1px solid var(--border); box-shadow:var(--hl), var(--lift);
  }
  .sg-row { box-shadow:var(--hl); }
  .sg-group-row { background:linear-gradient(90deg,rgba(59,130,246,.1),transparent 40%), var(--surface2); }
  .sg-row.playing { background:linear-gradient(90deg,rgba(34,197,94,.16),transparent 50%), #0c1a12; box-shadow:inset 3px 0 0 var(--accent), 0 0 20px -6px rgba(34,197,94,.5); }
  .sg-onair { box-shadow:var(--glow-g); }

  /* Buttons: machined keys */
  button { background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.01)), var(--surface2); box-shadow:var(--hl), 0 1px 2px rgba(0,0,0,.4); }
  button:hover { background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02)), var(--raised); }
  button.primary { background:linear-gradient(180deg,#4ade80,#16a34a); border-color:#22c55e; color:#03140a; box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 4px 16px -4px rgba(34,197,94,.7); }
  button.primary:hover { background:linear-gradient(180deg,#6ee79a,#22c55e); box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 4px 22px -2px rgba(34,197,94,.8); }
  button.danger { background:linear-gradient(180deg,rgba(239,68,68,.32),rgba(127,29,29,.55)); border-color:rgba(239,68,68,.5); color:#fecaca; }
  button.danger:hover { background:linear-gradient(180deg,rgba(239,68,68,.5),rgba(153,27,27,.7)); box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 4px 18px -4px rgba(239,68,68,.7); }
  .toggle { background:rgba(0,0,0,.5); box-shadow:inset 0 1px 3px rgba(0,0,0,.7), 0 0 0 1px var(--border); }
  .toggle.on { background:linear-gradient(90deg,#16a34a,#22c55e); box-shadow:inset 0 1px 2px rgba(0,0,0,.3), 0 0 12px rgba(34,197,94,.55); }
  .toggle::after { box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .chip.active { box-shadow:0 0 12px -2px rgba(34,197,94,.5); }

  /* Live state as light */
  .dot.on { animation:livepulse 2s ease-in-out infinite; }
  @keyframes livepulse { 0%,100% { box-shadow:0 0 0 0 rgba(34,197,94,.6), 0 0 8px var(--accent); } 50% { box-shadow:0 0 0 5px rgba(34,197,94,0), 0 0 8px var(--accent); } }
  .tally.pgm { box-shadow:var(--glow-r); }
  .tally.pvw { box-shadow:var(--glow-g); }

  /* Tiles: tint line on top + corner glow in the tile's own color */
  .tile { position:relative; overflow:hidden; --tint:var(--accent); }
  .tile::before { content:''; position:absolute; inset:0 0 auto 0; height:2px; background:linear-gradient(90deg,transparent,var(--tint),transparent); opacity:.85; }
  .tile::after { content:''; position:absolute; width:280px; height:280px; right:-110px; top:-150px; border-radius:50%; background:radial-gradient(var(--tint),transparent 65%); opacity:.16; pointer-events:none; }
  .tile.click:hover { border-color:color-mix(in srgb, var(--tint) 45%, transparent); box-shadow:var(--hl), var(--lift), 0 0 30px -10px var(--tint); }
  .t-label { color:#a9aec2; font-weight:600; letter-spacing:1.2px; display:flex; align-items:center; gap:8px; }
  .t-big.ok { color:#4ade80; text-shadow:0 0 26px rgba(34,197,94,.55); }
  .t-big.blue { color:#60a5fa; text-shadow:0 0 26px rgba(59,130,246,.55); }
  .t-big.cyan { color:var(--cyan); text-shadow:0 0 26px rgba(34,211,238,.5); }
  .t-big.purple { color:var(--purple); text-shadow:0 0 26px rgba(167,139,250,.5); }
  .t-head { display:flex; justify-content:space-between; align-items:baseline; }
  .t-link { font-size:12px; color:var(--text-dim); text-decoration:none; }
  .t-link:hover { color:var(--accent); }

  /* Overview layout: KPI strip, monitor wall + side column */
  .bento.ov { grid-template-columns:repeat(12,1fr); gap:16px; }
  .bento.ov > .kpi { grid-column:span 3; padding:16px 18px 0; display:flex; flex-direction:column; }
  .bento.ov > .wall-tile { grid-column:span 8; }
  .bento.ov > .ov-side { grid-column:span 4; display:flex; flex-direction:column; gap:16px; }
  @media (max-width:1180px) { .bento.ov > .kpi { grid-column:span 6; } .bento.ov > .wall-tile, .bento.ov > .ov-side { grid-column:span 12; } }
  @media (max-width:640px) { .bento.ov { gap:12px; } .bento.ov > .kpi { grid-column:span 6; padding:14px 14px 0; } .kpi .t-sub { font-size:11px; } .spark, .kpi-meter { width:calc(100% + 28px); margin-left:-14px; margin-right:-14px; } }
  .kpi .t-big { font-size:clamp(28px,2.4vw,36px); }
  .kpi .t-sub { display:flex; align-items:center; gap:6px; }
  .spark { display:block; width:calc(100% + 36px); height:38px; margin:10px -18px 0; }
  .kpi-meter { height:4px; margin:auto -18px 0; background:rgba(255,255,255,.05); }
  .kpi-meter span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--cyan)); box-shadow:var(--glow-g); transition:width .4s; }
  .kpi .t-sub { margin-bottom:12px; }
  .kpi .spark { margin-top:0; }

  .wall { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; margin-top:12px; }
  .mon { cursor:pointer; border-radius:10px; padding:6px; background:rgba(0,0,0,.35); border:1px solid var(--border); transition:transform .15s, box-shadow .15s, border-color .15s; }
  .mon:hover { transform:translateY(-2px); border-color:var(--border-hover); }
  .mon.on { border-color:rgba(34,197,94,.3); }
  .mon.pvw { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 22px -4px rgba(34,197,94,.7); }
  .mon.pgm { border-color:var(--danger); box-shadow:0 0 0 1px var(--danger), 0 0 26px -2px rgba(239,68,68,.75); }
  .mon.off { opacity:.55; }
  .mon-screen { position:relative; aspect-ratio:16/9; border-radius:6px; overflow:hidden;
                background:repeating-linear-gradient(45deg,#0a0b10 0 8px,#0d0f16 8px 16px); }
  .mon-screen img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .mon-screen img:not([src]) { display:none; }
  .mon-screen img[src] + .mon-empty { display:none; }
  .mon-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--text-dim); }
  .mon-screen::after { content:''; position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px); mix-blend-mode:multiply; }
  .mon-tally { position:absolute; top:6px; left:6px; z-index:1; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.8px; border-radius:3px; padding:1px 6px; }
  .mon-tally:empty { display:none; }
  .mon.pgm .mon-tally { background:var(--danger); color:#fff; box-shadow:var(--glow-r); }
  .mon.pvw .mon-tally { background:var(--accent); color:#000; box-shadow:var(--glow-g); }
  .mon-label { display:flex; align-items:center; gap:8px; font-size:13px; padding:7px 3px 2px; min-width:0; }
  .mon-label .dot { width:7px; height:7px; border-radius:50%; background:var(--border-hover); flex-shrink:0; }
  .mon-label .dot.on { background:var(--accent); }
  .mon-label .grow { flex:1; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mon-label .mono { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--text-dim); }

  .onair-lamp { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px; color:#fff; background:var(--danger); border-radius:3px; padding:1px 6px; box-shadow:var(--glow-r); animation:lamp 2.4s ease-in-out infinite; }
  @keyframes lamp { 0%,100% { box-shadow:0 0 18px rgba(239,68,68,.7); } 50% { box-shadow:0 0 6px rgba(239,68,68,.3); } }
  .sg-now { margin-top:10px; }
  .sg-now + .sg-now { padding-top:12px; border-top:1px solid var(--border); }
  .sg-now-name { display:flex; justify-content:space-between; font-size:13px; margin-bottom:8px; }
  .sg-now-name .mono { font-family:'JetBrains Mono',monospace; color:var(--warning); font-size:13px; }
  .sg-now-row { display:flex; align-items:center; gap:10px; }
  .sg-now-thumb { flex-shrink:0; aspect-ratio:16/9; border-radius:5px; overflow:hidden; background:#000; border:1px solid var(--border); }
  .sg-now-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .sg-now-thumb.cur { width:112px; border-color:var(--danger); box-shadow:0 0 16px -4px rgba(239,68,68,.7); }
  .sg-now-thumb.nxt { width:60px; opacity:.6; }
  .sg-now-text { flex:1; min-width:0; }
  .sg-now-text .now { font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-now-text .next { font-size:12px; color:var(--text-dim); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sg-progress { height:3px; margin-top:10px; border-radius:2px; background:rgba(255,255,255,.06); overflow:hidden; }
  .sg-progress span { display:block; height:100%; background:linear-gradient(90deg,var(--warning),var(--danger)); box-shadow:0 0 8px rgba(239,68,68,.6); transition:width 2.8s linear; }
  .media-strip { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; margin-top:12px; }
  .media-strip img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:4px; background:#000; border:1px solid var(--border); }
  .media-strip:empty { display:none; }

  /* Instances: grid of boxes — screen on top, info, then a control strip */
  .instances { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .instance-card { display:flex; flex-direction:column; padding:0; overflow:hidden; border-radius:12px; position:relative; }
  .instance-card::before { content:''; position:absolute; inset:0 0 auto 0; height:2px; z-index:2; background:var(--border); }
  .instance-card.running::before { background:linear-gradient(90deg,var(--accent),var(--cyan)); box-shadow:var(--glow-g); }
  .instance-card.running { border-color:rgba(34,197,94,.25); }
  .instance-card.pvw { border-color:var(--accent); box-shadow:var(--hl), var(--lift), 0 0 0 1px var(--accent), 0 0 26px -8px rgba(34,197,94,.8); }
  .instance-card.pgm { border-color:var(--danger); box-shadow:var(--hl), var(--lift), 0 0 0 1px var(--danger), 0 0 30px -6px rgba(239,68,68,.8); }
  .instance-card.pgm::before { background:var(--danger); box-shadow:var(--glow-r); }
  .instance-card.disabled { opacity:.6; }
  .instance-card:hover { border-color:var(--border-hover); }
  .ic-screen { position:relative; aspect-ratio:16/9; background:repeating-linear-gradient(45deg,#0a0b10 0 8px,#0d0f16 8px 16px); border-bottom:1px solid var(--border); }
  .ic-screen .instance-preview, .ic-screen .instance-preview-empty { position:absolute; inset:0; width:100%; height:100%; border:none; border-radius:0; background:transparent; }
  .ic-screen .instance-preview-empty { display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--text-dim); }
  .ic-screen::after { content:''; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 30%,transparent 75%,rgba(0,0,0,.5)); }
  .ic-overlay { position:absolute; inset:8px 8px auto 8px; z-index:1; display:flex; align-items:center; gap:6px; pointer-events:none; }
  .ic-spacer { flex:1; }
  .ic-state { font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:700; letter-spacing:1px; padding:2px 7px; border-radius:3px; background:rgba(0,0,0,.6); color:var(--text-dim); border:1px solid var(--border); backdrop-filter:blur(4px); }
  .ic-state.on { color:#4ade80; border-color:rgba(34,197,94,.55); text-shadow:0 0 8px rgba(34,197,94,.9); }
  .ic-state.on::before { content:'● '; animation:up-pulse 1.6s ease-in-out infinite; }
  .ic-rx { pointer-events:auto; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:11px; padding:2px 7px; border-radius:3px; background:rgba(0,0,0,.6); color:var(--text-dim); border:1px solid var(--border); backdrop-filter:blur(4px); }
  .ic-rx.active { color:#93c5fd; border-color:rgba(59,130,246,.5); }
  .ic-rx:hover { border-color:var(--border-hover); color:var(--text); }
  .ic-pop { position:absolute; right:8px; bottom:8px; z-index:1; font-size:11px; padding:2px 8px; border-radius:3px; background:rgba(0,0,0,.7); color:var(--text); opacity:0; transition:opacity .15s; pointer-events:none; }
  .ic-screen:hover .ic-pop { opacity:1; }
  .ic-vstate { position:absolute; left:8px; bottom:8px; z-index:1; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.8px; padding:2px 7px; border-radius:3px; background:rgba(0,0,0,.65); color:var(--text-dim); pointer-events:none; }
  .ic-vstate.on { color:#4ade80; }
  .ic-body { padding:9px 12px 2px; display:flex; flex-direction:column; gap:5px; min-width:0; }
  .ic-title { display:flex; align-items:center; min-width:0; }
  .ic-name { font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ic-source { font-size:12px; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ic-chips { display:flex; gap:5px; flex-wrap:wrap; margin-top:2px; }
  .ic-chip { font-family:'JetBrains Mono',monospace; font-size:11px; padding:1px 7px; border-radius:10px; background:rgba(255,255,255,.04); border:1px solid var(--border); color:#b3b8c9; }
  .ic-chip.fps { color:var(--warning); border-color:rgba(245,158,11,.3); background:rgba(245,158,11,.06); }
  .ic-chip.refresh { color:#93c5fd; border-color:rgba(59,130,246,.3); background:rgba(59,130,246,.06); }
  .ic-controls { display:flex; align-items:center; gap:6px; padding:8px 10px 10px; margin-top:auto; }
  .ic-enable { display:flex; align-items:center; gap:6px; cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px; color:var(--text-dim); }
  .btn-group { display:flex; margin-left:auto; border-radius:var(--radius); box-shadow:var(--hl), 0 1px 2px rgba(0,0,0,.4); }
  .btn-group button { border-radius:0; margin-left:-1px; box-shadow:none; min-width:28px; padding:5px 6px; }
  .btn-group button:first-child { border-radius:var(--radius) 0 0 var(--radius); margin-left:0; }
  .btn-group button:last-child { border-radius:0 var(--radius) var(--radius) 0; }
  .btn-group button:hover { transform:none; position:relative; z-index:1; }
  button.ghost-danger:hover { color:var(--danger); border-color:rgba(239,68,68,.5); }
  button.power { min-width:64px; font-weight:600; }
  @media (prefers-reduced-motion: reduce) { .mon:hover { transform:none; } }
  /* Phones: header wraps, tabs scroll sideways instead of squashing */
  @media (max-width:700px) {
    .header { flex-wrap:wrap; gap:10px; padding:12px 16px; }
    .header-left { flex-wrap:wrap; gap:8px; }
    .header-actions { width:100%; }
    .header-actions { gap:8px; }
    .header-actions .server-clock { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; text-align:center; }
    .wall { grid-template-columns:repeat(2,1fr); gap:8px; }
    .mon-label .mono { display:none; }
    .header-actions button { white-space:nowrap; }
    .tabs { padding:0 8px; overflow-x:auto; }
    .tab { padding:11px 14px; white-space:nowrap; }
    .main, .settings-bar { padding-left:16px; padding-right:16px; }
  }
</style>

<script>
const API = '/api';
let state = {

  media: [],
  modal: null,

  overview: { rx:null, sg:{}, sgSpan:{}, hist:{rx:[],egress:[],tcp:[]} },  // fleet receivers payload, signage statuses, sparkline history
  mediaFilter: { type:'all', source:'all', usage:'all' },
  // Signage tab
  signageInstId: null,

  sgCollapsed: {},      // group id -> collapsed
  rxModal: null,        // {instId, name, data} — receiver list popup
};
const sgSel = new Set(); // selected signage item ids (multi-select actions)

async function api(path, opts={}) {
  const headers = {};
  if (opts.body && !(opts.body instanceof FormData)) {
    headers['Content-Type'] = 'application/json';
  }
  const res = await fetch(API+path, { headers, ...opts,
    body: opts.body instanceof FormData ? opts.body : (opts.body ? JSON.stringify(opts.body) : undefined)
  });
  return res.json();
}

let settingsEditing = false;
let lastDataSig = '';
let lastSgSig = '';
let serverClock = null; // {epochMs, offsetMin, tz, receivedAt} — from /settings

// Format the SERVER's wall clock (schedules run on it, not the browser's)
function serverClockText() {
  if (!serverClock) return '';
  const wall = new Date(serverClock.epochMs + (Date.now() - serverClock.receivedAt)
                        + serverClock.offsetMin * 60000);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const p = n => String(n).padStart(2,'0');
  return `${days[wall.getUTCDay()]} ${wall.getUTCMonth()+1}/${wall.getUTCDate()} `
       + `${p(wall.getUTCHours())}:${p(wall.getUTCMinutes())}:${p(wall.getUTCSeconds())}`
       + (serverClock.tz ? ` ${serverClock.tz}` : '');
}
function tickServerClock() {
  const el = document.getElementById('server-clock');
  if (el) el.textContent = serverClockText();
}

async function loadData(force=false) {
  // Signage playlist is fetched in the same parallel batch (using the
  // current selection) instead of as a follow-up round trip
  const [settings, instances, media, signagePre] = await Promise.all([
    api('/settings'), api('/instances'), api('/media'),
    state.signageInstId
      ? api(`/instances/${state.signageInstId}/signage`).catch(()=>null)
      : Promise.resolve(null),
  ]);
  // Pull the server clock out of the settings payload BEFORE it feeds the
  // change signature — it changes every poll and must not force re-renders.
  // The header ticks it forward locally between polls.
  if (settings.server_time_ms != null) {
    serverClock = {
      epochMs: settings.server_time_ms,
      offsetMin: settings.server_tz_offset_min || 0,
      tz: settings.server_tz || '',
      receivedAt: Date.now(),
    };
    delete settings.server_time_ms;
    delete settings.server_tz;
    delete settings.server_tz_offset_min;
  }
  state.settings = settings;
  state.instances = instances;
  state.media = media;
  if (!settingsEditing) {
    state.fpsInput = String(settings.output_fps);
  }
  // Signage: keep a valid selection; only refetch when the parallel fetch
  // used a selection that turned out stale (deleted instance, first load)
  const sgInsts = instances.filter(i => i.source_type === 'signage');
  const hadSel = state.signageInstId;
  if (!sgInsts.some(i => i.id === state.signageInstId)) {
    state.signageInstId = sgInsts.length ? sgInsts[0].id : null;
  }
  if (state.signageInstId) {
    if (signagePre && hadSel === state.signageInstId) {
      state.signage = signagePre;
    } else {
      try { state.signage = await api(`/instances/${state.signageInstId}/signage`); }
      catch(e) { state.signage = null; }
    }
  } else {
    state.signage = null;
  }
  // Drop cached previews for instances that are no longer running
  for (const id of Object.keys(previewCache)) {
    if (!instances.some(i => String(i.id) === id && i.running)) {
      URL.revokeObjectURL(previewCache[id]);
      delete previewCache[id];
    }
  }
  // Only rebuild the DOM when the data actually changed — a full re-render
  // every poll recreates every element and makes images flash. The signage
  // playlist has its own signature: when ONLY it changed (impressions
  // ticking up every slot, edits from another session), the lit-rendered
  // list updates IN PLACE instead of rebuilding the page.
  const sig = JSON.stringify([settings, instances, media]);
  const sgSig = JSON.stringify(state.signage);
  if (force || sig !== lastDataSig) {
    lastDataSig = sig;
    lastSgSig = sgSig;
    render();
  } else if (sgSig !== lastSgSig) {
    lastSgSig = sgSig;
    if (state.tab === 'signage') {
      if (sgListEl && document.body.contains(sgListEl) && state.signage) {
        sgRenderList();
        sgUpdateToolbar();
        const hint = document.getElementById('sg-defaults-hint');
        if (hint) hint.textContent = sgDefaultsHint();
      } else {
        render();
      }
    }
  }
}

// --- Flicker-free preview refresh -------------------------------------
// Previews are fetched as blobs, fully decoded off-screen, then swapped
// into the existing <img> in place. The old frame stays visible until the
// new one is ready, so there's no flash of empty/loading image.
const previewCache = {}; // instance id -> object URL of last decoded frame
let previewsBusy = false; // reentrancy guard — slow fetches must not pile up

async function updatePreviews() {
  if (previewsBusy || document.hidden) return;
  previewsBusy = true;
  try {
    await _updatePreviews();
  } finally {
    previewsBusy = false;
  }
}

async function _updatePreviews() {
  for (const inst of state.instances) {
    if (!inst.running || state.modal) continue;
    try {
      const res = await fetch(`${API}/instances/${inst.id}/preview?t=${Date.now()}`);
      if (res.status !== 200) continue;
      const blob = await res.blob();
      if (!blob.size) continue;
      const url = URL.createObjectURL(blob);
      const tmp = new Image();
      tmp.src = url;
      try { await tmp.decode(); } catch(e) {}
      const old = previewCache[inst.id];
      previewCache[inst.id] = url;
      // Swap into live cards (decoded → paints instantly, no flash)
      document.querySelectorAll(`img[data-preview="${inst.id}"]`).forEach(img => { img.src = url; });
      // First frame after start: upgrade the placeholder to an image
      document.querySelectorAll(`[data-preview-slot="${inst.id}"]`).forEach(ph => {
        ph.replaceWith(h('img',{className:'instance-preview','data-preview':inst.id,src:url,alt:'Preview'}));
      });
      if (old && old !== url) URL.revokeObjectURL(old);
    } catch(e) {}
  }
}

// --- Uploads with progress ---------------------------------------------
// fetch() can't report upload progress, so uploads go through XHR. While
// anything is uploading/processing a full-page overlay with large progress
// bars is shown (dismissible to a bottom-right mini panel — the upload
// keeps going either way); once everything finishes, the overlay closes
// and done/error cards linger briefly in the mini panel. Both live outside
// the re-rendered app root so poll re-renders can't clobber them.
const uploads = [];
let uploadSeq = 0;
let uploadsMinimized = false; // user hid the overlay for this batch

function uploadStatusText(u) {
  return u.status==='uploading' ? `${u.pct}%`
    : u.status==='processing' ? 'processing…'
    : u.status==='done' ? '✓ done' : '✗ failed';
}

// One progress card, in overlay ('upov') or mini-panel ('up') styling
function uploadCard(u, pre, closable) {
  return h('div',{className:`${pre}-item ${u.status}`},
    h('div',{className:`${pre}-head`},
      h('div',{className:`${pre}-name`,title:u.name},u.name),
      h('div',{className:`${pre}-status`},uploadStatusText(u)),
      closable && (u.status==='done'||u.status==='error')
        ? h('div',{className:'up-close',onClick:()=>{removeUpload(u.id);}},'✕') : null,
    ),
    h('div',{className:`${pre}-bar`},h('div',{className:`${pre}-fill`,style:{width:`${u.pct}%`}})),
    u.status==='error'&&u.msg ? h('div',{className:`${pre}-err`},u.msg) : null,
  );
}

function updateUploadPanel() {
  let panel = document.getElementById('upload-panel');
  let overlay = document.getElementById('upload-overlay');
  if (!uploads.length) {
    if (panel) panel.remove();
    if (overlay) overlay.remove();
    return;
  }
  const active = uploads.some(u=>u.status==='uploading'||u.status==='processing');

  if (active && !uploadsMinimized) {
    // Full-page overlay with large per-file bars
    if (panel) panel.remove();
    if (!overlay) {
      overlay = h('div',{id:'upload-overlay'});
      document.body.appendChild(overlay);
    }
    const total = uploads.length;
    const finished = uploads.filter(u=>u.status==='done'||u.status==='error').length;
    overlay.innerHTML = '';
    overlay.appendChild(h('div',{className:'upov-panel'},
      h('div',{className:'upov-title'},'Uploading media'),
      h('div',{className:'upov-sub'},
        `${finished} of ${total} file${total===1?'':'s'} finished — keep this page open until uploads complete`),
      ...uploads.map(u=>uploadCard(u,'upov',false)),
      h('div',{className:'upov-actions'},
        h('button',{className:'sm',onClick:()=>{uploadsMinimized=true;updateUploadPanel();}},
          'Hide — keep uploading in background'),
      ),
    ));
    return;
  }

  // Minimized / finished: compact bottom-right panel
  if (overlay) overlay.remove();
  if (!panel) {
    panel = h('div',{id:'upload-panel'});
    document.body.appendChild(panel);
  }
  panel.innerHTML = '';
  for (const u of uploads) panel.appendChild(uploadCard(u,'up',true));
}

function removeUpload(id) {
  const i = uploads.findIndex(u=>u.id===id);
  if (i>=0) uploads.splice(i,1);
  updateUploadPanel();
}

function uploadWithProgress(url, file) {
  return new Promise(resolve => {
    if (!uploads.length) uploadsMinimized = false; // fresh batch → overlay again
    const u = {id:++uploadSeq, name:file.name, pct:0, status:'uploading', msg:''};
    uploads.push(u); updateUploadPanel();
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.upload.onprogress = e => {
      if (e.lengthComputable) {
        u.pct = Math.round(e.loaded / e.total * 100);
        // Bytes are all sent — now the server is probing/converting
        if (u.pct >= 100) u.status = 'processing';
        updateUploadPanel();
      }
    };
    const finish = ok => { updateUploadPanel(); if(ok) setTimeout(()=>removeUpload(u.id), 4000); resolve(ok); };
    xhr.onload = () => {
      let body = {}; try { body = JSON.parse(xhr.responseText); } catch(e) {}
      if (xhr.status >= 200 && xhr.status < 300) { u.status='done'; u.pct=100; finish(true); }
      else { u.status='error'; u.msg = body.error || `HTTP ${xhr.status}`; finish(false); }
    };
    xhr.onerror = () => { u.status='error'; u.msg='Network error'; finish(false); };
    xhr.ontimeout = () => { u.status='error'; u.msg='Timed out'; finish(false); };
    const fd = new FormData(); fd.append('file', file);
    xhr.send(fd);
  });
}

// --- Receivers popup (who is pulling a source / the whole server) ---------
// The modal SHELL is built once per open; the BODY is rendered by lit-html
// into a stable container and updated IN PLACE on every 3s refresh — no DOM
// rebuild, so scroll position, text selection and row identity all survive.
// Rows are keyed by IP (repeat), so churn moves/updates rows rather than
// recreating them. If the lit module failed to load, the fallback rebuilds
// the container the old way.
let rxBodyEl = null;

async function openRxModal(inst) {
  // inst = one instance, or null for the fleet-wide view (header pill)
  state.rxModal = inst ? {instId: inst.id, name: inst.name, data: null}
                       : {all: true, data: null};
  render();
  await refreshRxModal();
}
async function refreshRxModal() {
  const m = state.rxModal;
  if (!m) return;
  try {
    const d = m.all ? await api('/receivers')
                    : await api(`/instances/${m.instId}/receivers`);
    if (state.rxModal !== m) return;
    m.data = d;
    // In-place body update — the modal element is never rebuilt on refresh
    if (rxBodyEl && document.body.contains(rxBodyEl)) rxRenderBody();
    else render();
  } catch(e) {}
}

const rxTransportLabel = r =>
  r.active===false ? 'disconnected'
  : r.transport==='tcp' ? '⇄ TCP'
  : r.transport==='udp-multicast' ? '⇢ UDP / multicast'
  : r.transport==='measuring' ? 'measuring…' : '—';

const RX_TRANSPORT_TIP =
  'Inferred from TCP throughput: media flowing over the TCP connection = TCP; '+
  'a quiet control-only connection means the video travels as UDP or multicast';

// lit templates (primary path) ------------------------------------------
function rxLitTable(receivers) {
  const {html, repeat} = window.lit;
  return html`<table class="rx-table">
    <thead><tr><th>Hostname</th><th>IP Address</th><th>Conns</th>
      <th>Transport</th><th>TCP Rate</th></tr></thead>
    <tbody>${repeat(receivers, r=>r.ip, r=>html`
      <tr class=${r.active===false?'gone':''}>
        <td>${r.hostname||'—'}</td>
        <td class="mono">${r.ip}</td>
        <td>${r.connections}</td>
        <td title=${RX_TRANSPORT_TIP}>${rxTransportLabel(r)}</td>
        <td class="mono">${r.mbps!=null?`${r.mbps} Mbps`:''}</td>
      </tr>`)}</tbody></table>`;
}

function rxLitBody(m) {
  const {html, repeat} = window.lit;
  const data = m.data;
  if (!data) return html`<div class="form-hint">Looking up connections…</div>`;
  if (m.all) {
    const stat = (label,val) => html`<div>
      <div class="rx-stat-label">${label}</div>
      <div class="rx-stat-val">${val}</div></div>`;
    return html`
      <div class="rx-stats">
        ${stat('Server Egress', data.egress_mbps!=null ? `${data.egress_mbps} Mbps` : 'measuring…')}
        ${stat('Summed TCP Rate', `${data.total_tcp_mbps} Mbps`)}
        ${stat('Receivers', `${data.unique_receivers} unique · ${data.total_connections} conn${data.total_connections===1?'':'s'}`)}
      </div>
      ${!data.instances.length
        ? html`<div class="form-hint">No running instances.</div>`
        : repeat(data.instances, i=>i.instance_id, i=>html`
            <div style="margin-top:14px">
              <div class="section-title" style="margin-bottom:6px">
                #${i.instance_id} ${i.name}${i.sdk_receivers!=null?` — SDK reports ${i.sdk_receivers}`:''}</div>
              ${i.receivers.length ? rxLitTable(i.receivers)
                : html`<div class="form-hint">No receivers connected.</div>`}
            </div>`)}`;
  }
  if (!data.supported)
    return html`<div class="form-hint">Not available: ${data.reason||'unsupported'}</div>`;
  if (!data.receivers || !data.receivers.length)
    return html`<div class="form-hint">${data.running===false ? 'Instance not running.' : 'No receivers connected.'}</div>`;
  return rxLitTable(data.receivers);
}

// Fallback path (lit module unavailable): rebuild the container's children
function rxTable(receivers) {
  return h('table',{className:'rx-table'},
    h('thead',null,h('tr',null,
      h('th',null,'Hostname'),h('th',null,'IP Address'),h('th',null,'Conns'),
      h('th',null,'Transport'),h('th',null,'TCP Rate'))),
    h('tbody',null, ...receivers.map(r=>h('tr',{className:r.active===false?'gone':''},
      h('td',null,r.hostname||'—'),
      h('td',{className:'mono'},r.ip),
      h('td',null,String(r.connections)),
      h('td',{title:RX_TRANSPORT_TIP},rxTransportLabel(r)),
      h('td',{className:'mono'},r.mbps!=null?`${r.mbps} Mbps`:''),
    ))),
  );
}

function rxRenderBody() {
  if (!rxBodyEl || !state.rxModal) return;
  if (window.lit) {
    window.lit.render(rxLitBody(state.rxModal), rxBodyEl);
    return;
  }
  const m = state.rxModal, data = m.data;
  rxBodyEl.innerHTML = '';
  let body;
  if (!data) body = h('div',{className:'form-hint'},'Looking up connections…');
  else if (m.all) {
    const stat = (label,val) => h('div',null,
      h('div',{className:'rx-stat-label'},label),
      h('div',{className:'rx-stat-val'},val));
    body = h('div',null,
      h('div',{className:'rx-stats'},
        stat('Server Egress', data.egress_mbps!=null ? `${data.egress_mbps} Mbps` : 'measuring…'),
        stat('Summed TCP Rate', `${data.total_tcp_mbps} Mbps`),
        stat('Receivers', `${data.unique_receivers} unique · ${data.total_connections} conn${data.total_connections===1?'':'s'}`),
      ),
      !data.instances.length
        ? h('div',{className:'form-hint'},'No running instances.')
        : data.instances.map(i=>h('div',{style:{marginTop:'14px'}},
            h('div',{className:'section-title',style:{marginBottom:'6px'}},
              `#${i.instance_id} ${i.name}`
              + (i.sdk_receivers!=null?` — SDK reports ${i.sdk_receivers}`:'')),
            i.receivers.length ? rxTable(i.receivers)
              : h('div',{className:'form-hint'},'No receivers connected.'),
          )),
    );
  }
  else if (!data.supported) body = h('div',{className:'form-hint'},`Not available: ${data.reason||'unsupported'}`);
  else if (!data.receivers || !data.receivers.length)
    body = h('div',{className:'form-hint'},
      data.running===false ? 'Instance not running.' : 'No receivers connected.');
  else body = rxTable(data.receivers);
  rxBodyEl.appendChild(body);
}
window.rxRenderBody = rxRenderBody; // the lit module upgrades an open popup on load

const RX_HINT =
  'Every receiver keeps a TCP control connection whatever the video transport; the Transport column '+
  'tells them apart by measuring it — megabits on the socket = TCP media, near-idle = UDP or multicast. '+
  'Hostnames come from reverse DNS and rates need two samples, so both can take a refresh to fill in. '+
  'Auto-refreshes while open.';

function renderRxModal() {
  if (!state.rxModal) return null;
  const {all, name} = state.rxModal;
  const close = ()=>{state.rxModal=null; rxBodyEl=null; render();};

  const hint = all
    ? 'All established NDI connections across running sources. Summed TCP rate counts media on those '+
      'connections; server egress is the interface-counter total actually leaving the box (loopback excluded) — '+
      'it also carries UDP/multicast media, previews and this web UI, so the gap between the two is roughly '+
      'the non-TCP output. ' + RX_HINT
    : `Established NDI connections to this source, from the worker's sockets. ` + RX_HINT;

  // Stable body container: lit renders (and re-renders in place) into it
  rxBodyEl = h('div');
  rxRenderBody();

  return h('div',{className:'modal-overlay',onClick:e=>{if(e.target.className==='modal-overlay')close();}},
    h('div',{className:'modal',style:{width: all?'640px':'560px'}},
      h('h2',null, all ? 'All Receivers & Bandwidth' : `Receivers — ${name}`),

// Live preview popup — one window per instance (reused on re-click). Sized
// to the output aspect ratio plus room for the header/footer bars.
function openPreviewPopup(inst) {
  const w = 720;
  const h = Math.round(w * (inst.height / inst.width)) + 70;
  window.open(`/preview/${inst.id}`, `wr2-preview-${inst.id}`,
    `width=${w},height=${h},resizable=yes,scrollbars=no,location=no,toolbar=no,menubar=no`);
}

// DOM helper
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)) {
    if(v==null||v===false) continue; // null/false = attribute absent (setAttribute would stringify it — a disabled="null" button is still disabled)
    if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className') el.className=v;
    else if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k,v);
  }
  for(const c of children.flat()) { if(c==null)continue; el.appendChild(typeof c==='string'?document.createTextNode(c):c); }
  return el;
}

// --- Virtual pages (hash routes) -----------------------------------------
// #/instances · #/signage · #/signage/<id> · #/media — refreshing or
// bookmarking keeps the current tab (and signage selection); back/forward
// navigate between tabs.

function applyRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  if (['overview','instances','signage','media'].includes(parts[0])) state.tab = parts[0];
  if (parts[0]==='signage' && parts[1]) {
    const id = parseInt(parts[1]);
    if (id) state.signageInstId = id;
  }
}

function routeHash() {
  return state.tab==='signage' && state.signageInstId
    ? `#/signage/${state.signageInstId}` : `#/${state.tab}`;
}

// Normalize the URL to current state without adding history entries
// (replaceState doesn't fire hashchange, so no render loop)
function syncRoute() {
  const target = routeHash();
  if (location.hash !== target) history.replaceState(null, '', target);
}

window.addEventListener('hashchange', () => {
  const prevInst = state.signageInstId;
  applyRoute();
  if (state.tab==='signage' && state.signageInstId !== prevInst) {
    sgSel.clear();
    loadData(true);
  } else {
    render();
  }
});

// --- Media Library filters -------------------------------------------------

function mediaMatchesFilter(m, f) {
  if (f.type==='image' && m.is_video) return false;
  if (f.type==='video' && !m.is_video) return false;
  const src = m.origin || 'library';
  if (f.source!=='all' && src!==f.source) return false;
  const su = m.signage_usage || [];
  if (f.usage==='grouped' && !su.some(u=>u.group_id)) return false;
  if (f.usage==='playlist' && !su.length) return false;
  if (f.usage==='unused') {
    const usedByInst = state.instances.some(i=>i.media_file_id===m.id);
    if (su.length || usedByInst) return false;
  }
  return true;
}

function renderMediaCard(m) {
  const usedBy = state.instances.filter(i=>i.media_file_id===m.id);
  const su = m.signage_usage || [];
  const dur = m.duration_s ? ` · ${Math.floor(m.duration_s/60)}:${String(Math.round(m.duration_s%60)).padStart(2,'0')}` : '';
  const size = m.file_size > 1048576 ? `${(m.file_size/1048576).toFixed(1)}MB` : `${(m.file_size/1024).toFixed(0)}KB`;
  const origin = m.origin || 'library';
  const originLabel = {library:'Library upload', signage:'Signage upload',
                       deck:`Deck: ${m.origin_name||'?'}`}[origin] || origin;
  // One line per playlist appearance: "Instance › Group"
  const suLabels = [...new Set(su.map(u =>
    `${u.instance_name||('#'+u.instance_id)}${u.group_name?` › ${u.group_name}`:''}`))];
  return h('div',{className:'media-card'},
    // Server-generated poster JPEG — a plain <img> per card instead of a
    // full <video> element (browsers cap concurrent media decoders, which
    // made video thumbnails flaky in bigger libraries)
    h('div',{className:'media-thumb-wrap'},
      h('img',{src:m.thumb_url,alt:m.original_name,loading:'lazy',
               onError:e=>{e.target.style.visibility='hidden';}}),
      m.is_video ? h('div',{className:'play-glyph'},'▶') : null,
    ),
    h('div',{className:'media-card-info'},
      h('div',{className:'media-card-name'},
        h('span',{className:'type-badge'},m.is_video?'VID':'IMG'), m.original_name),
      h('div',{className:'media-card-meta'},
        `${m.width_px||'?'}×${m.height_px||'?'}${dur} · ${size}`),
      h('div',{className:'media-card-meta',title:'Permanent ID for API playback URLs — never reused, even after deletes'},
        `id ${m.id}${m.uid?` · uid ${m.uid}`:''}`),
      h('div',{className:'media-origin',title:'How this file was added'},originLabel),
      (()=>{ // background-optimization state for videos
        const s = m.optimize_status;
        if (s==='done') return h('div',{className:'media-opt done',
          title:'A light H.264 playback copy is used on air; ?original=1 fetches the upload'},
          `⚡ optimized → ${m.optimized_width||'?'}×${m.optimized_height||'?'}`);
        if (s==='native') return h('div',{className:'media-opt done',
          title:'Already H.264/yuv420p within the output size — plays as-is'},
          '✓ playback-ready');

        if (s==='failed') return h('div',{className:'media-opt warn'},'⚠ optimize failed');
        if (s==='skipped') return h('div',{className:'media-opt warn',
          title:'Install ffmpeg on the server (apt install ffmpeg) and click Optimize'},
          '⚠ heavy video — ffmpeg missing');
        return null;
      })(),
      usedBy.length ? h('div',{className:'media-usage'},`Source for: ${usedBy.map(i=>i.name).join(', ')}`) : null,
      suLabels.length ? h('div',{className:'media-usage'},`Playlist: ${suLabels.join(' · ')}`) : null,
    ),
    h('div',{className:'media-card-actions'},
      m.can_optimize
        ? h('button',{className:'sm',title:'Create a light playback copy sized for the outputs',
            onClick:(e)=>{e.stopPropagation();optimizeMedia(m.id);}},'⚡')

            onClick:(e)=>{e.stopPropagation();window.open(m.download_optimized_url,'_blank');}},'⬇⚡')
        : null,
      h('button',{className:'sm danger',onClick:(e)=>{e.stopPropagation();deleteMedia(m.id);}},'✕'),

function renderMediaPage() {
  const main = h('div',{className:'main'});
  const f = state.mediaFilter;

  // Upload zone
  const zone = h('div',{className:'upload-zone'},'Drop images or videos here, or click to upload');
  const fileInput = h('input',{type:'file',accept:'image/*,video/*',multiple:'true',style:{display:'none'}});
  fileInput.addEventListener('change',e=>{Array.from(e.target.files).forEach(uploadFile);});
  zone.addEventListener('click',()=>fileInput.click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');Array.from(e.dataTransfer.files).forEach(uploadFile);});
  main.appendChild(zone);
  main.appendChild(fileInput);

  // Filter bar — counts are within the OTHER active filters, so they always
  // reflect what clicking the chip would show
  const chipRow = (label, key, options) => {
    const row = h('div',{className:'chip-group'}, h('span',{className:'chip-label'},label));
    for (const [val, text] of options) {
      const count = state.media.filter(m =>
        mediaMatchesFilter(m, {...f, [key]: val})).length;
      row.appendChild(h('button',
        {className:`chip ${f[key]===val?'active':''}`,
         onClick:()=>{state.mediaFilter={...f,[key]:val};render();}},
        `${text} (${count})`));
    }
    return row;
  };
  main.appendChild(h('div',{className:'media-filters'},
    chipRow('Type','type',[['all','All'],['image','Images'],['video','Videos']]),
    chipRow('Source','source',[['all','All'],['library','Library upload'],['signage','Signage upload'],['deck','Deck slides']]),
    chipRow('Usage','usage',[['all','All'],['grouped','In a signage group'],['playlist','In a playlist'],['unused','Unused']]),
  ));

  const filtered = state.media.filter(m=>mediaMatchesFilter(m, f));
  const filterActive = f.type!=='all'||f.source!=='all'||f.usage!=='all';
  main.appendChild(h('div',{className:'section-header',style:{marginTop:'16px'}},
    h('div',{className:'section-title'},
      filterActive ? `Library (${filtered.length} of ${state.media.length} files)`
                   : `Library (${state.media.length} files)`),
  ));

  if(!state.media.length) {
    main.appendChild(h('div',{className:'empty-state'},h('div',{className:'icon'},'▦'),h('div',null,'No files uploaded yet.')));
  } else if(!filtered.length) {
    main.appendChild(h('div',{className:'empty-state'},h('div',{className:'icon'},'🔍'),h('div',null,'No files match the current filters.')));
  } else if (f.source==='deck') {
    // Deck view: one section per source deck, slides in order
    const decks = {};
    filtered.forEach(m=>{ (decks[m.origin_name||'Unknown deck'] ??= []).push(m); });
    for (const [deck, files] of Object.entries(decks)) {
      main.appendChild(h('div',{className:'section-header',style:{marginTop:'14px'}},
        h('div',{className:'section-title'},`Deck: ${deck} (${files.length} slides)`)));
      const grid = h('div',{className:'media-grid'});
      files.sort((a,b)=>a.original_name.localeCompare(b.original_name))
           .forEach(m=>grid.appendChild(renderMediaCard(m)));
      main.appendChild(grid);
    }
  } else {
    const grid = h('div',{className:'media-grid'});
    filtered.forEach(m=>grid.appendChild(renderMediaCard(m)));
    main.appendChild(grid);
  }
  return main;
}

// --- Overview (bento home tab) --------------------------------------------
// Modular at-a-glance tiles: output health, what's on air, receiver totals,
// server egress. Rendered by lit into a stable container so the 3s refresh
// updates the numbers in place.
let ovEl = null;

function fmtBytes(n) {
  if (n >= 1073741824) return (n/1073741824).toFixed(1)+' GB';
  if (n >= 1048576) return (n/1048576).toFixed(1)+' MB';
  return Math.round(n/1024)+' KB';
}

async function updateOverview() {
  if (state.tab!=='overview' || document.hidden) return;
  const sgIds = state.instances
    .filter(i=>i.source_type==='signage' && i.running).map(i=>i.id);
  const [rx, ...sts] = await Promise.all([
    api('/receivers').catch(()=>null),
    ...sgIds.map(id=>api(`/instances/${id}/signage/status`).catch(()=>null)),
  ]);
  if (rx) {
    state.overview.rx = rx;
    // Rolling ~5 min history (3s polls) for the KPI sparklines — kept
    // client-side only, so it starts fresh on every page load
    const hist = state.overview.hist;
    const push = (k,v) => { hist[k].push(v); if (hist[k].length > OV_HIST) hist[k].shift(); };
    push('rx', rx.unique_receivers);
    push('egress', rx.egress_mbps);
    push('tcp', rx.total_tcp_mbps);
  }
  state.overview.sg = {};
  sgIds.forEach((id,i)=>{
    const s = sts[i];
    if (!s) return;
    state.overview.sg[id] = s;
    // The status only carries time remaining: remember the largest value
    // seen for the current item so the countdown bar has a denominator
    const st = s.status, cur = st && st.current;
    const span = state.overview.sgSpan;
    if (cur && st.remaining_s!=null) {
      const prev = span[id];
      span[id] = prev && prev.item===cur.id
        ? {item:cur.id, max:Math.max(prev.max, st.remaining_s)}
        : {item:cur.id, max:st.remaining_s};
    }
  });
  if (ovEl && document.body.contains(ovEl)) ovRender();
}

const OV_HIST = 100;

// Inline SVG sparkline: area + line, scaled to the series' own range
function ovSpark(values, color) {
  const {svg} = window.lit;
  const v = values.filter(x=>x!=null);
  if (v.length < 2) return svg`<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>`;
  const max = Math.max(...v), min = Math.min(...v);
  const range = (max - min) || 1;
  const pts = v.map((x,i)=>`${(i/(v.length-1)*100).toFixed(2)},${(27 - (x-min)/range*24).toFixed(2)}`);
  return svg`<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none">
    <polygon points="0,30 ${pts.join(' ')} 100,30" fill=${color} fill-opacity=".14"></polygon>
    <polyline points=${pts.join(' ')} fill="none" stroke=${color} stroke-width="1.6"
      vector-effect="non-scaling-stroke" stroke-linejoin="round"></polyline>
  </svg>`;
}

  const {html, repeat, nothing, render: litRender} = window.lit;
  const insts = state.instances;
  const running = insts.filter(i=>i.running);

  const totalSize = state.media.reduce((a,m)=>a+(m.file_size||0),0);
  const onPgm = running.filter(i=>i.ndi&&i.ndi.on_program).length;
  const go = hash => () => { location.hash = hash; };
  const thumb = id => id!=null ? `${API}/media/${id}/thumb` : nothing;

  // Monitor wall: running outputs first, then the rest, in their own order
  const wall = [...running, ...insts.filter(i=>!i.running)];

  litRender(html`
    <div class="tile kpi click" style="--tint:var(--accent)" @click=${go('#/instances')}>
      <div class="t-label">Outputs live</div>

    </div>

      <div class="t-label">Receivers</div>
      <div class="t-big ok">${rx?rx.unique_receivers:'…'}</div>
      <div class="t-sub">${rx?`${rx.total_connections} connection${rx.total_connections===1?'':'s'}`:'measuring…'}</div>
      ${ovSpark(hist.rx,'#22c55e')}
    </div>
    <div class="tile kpi click" style="--tint:var(--blue)" @click=${()=>openRxModal(null)}>
      <div class="t-label">Server egress</div>
      <div class="t-big blue">${rx&&rx.egress_mbps!=null?rx.egress_mbps:'…'}<small> Mbps</small></div>
      <div class="t-sub">all traffic leaving the box</div>
      ${ovSpark(hist.egress,'#3b82f6')}
